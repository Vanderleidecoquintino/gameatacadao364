le="flex:1;padding:5px;background:#000;color:#0f0;border:1px solid #0f0;border-radius:4px"><input id="eAndar" type="number" placeholder="A 1-3" style="flex:1;padding:5px;background:#000;color:#ff0;border:1px solid #ff0;border-radius:4px"></div><div style="display:flex;gap:4px;margin-top:4px"><button onclick="cancelE()" style="flex:1;background:#333;color:#fff;height:32px">CANCEL</button><button onclick="saveE()" style="flex:1;background:#0f0;color:#000;height:32px;font-weight:900">SALVAR</button></div></div><div style="display:flex;gap:3px;margin-top:4px"><button onclick="exportar()" style="flex:1;background:#0f0;color:#000;height:36px">💾 SALVAR</button><button onclick="fecharADM()" style="flex:1;background:#333;color:#fff;height:36px">FECHAR</button></div><div id="msgADM" style="font-size:8px;color:#0f0;text-align:center;margin-top:4px"></div></div>
<script>
const COLS=30,ROWS=20,W=40,H=26,KEY='ADM_V73_7_PISCA_28';
const MAP={'25-26':2,'23-24':4,'21-22':6,'19-20':8,'17-18':10,'15-16':12,'13-14':14,'11-12':16,'9-10':18,'7-8':20,'5-6':22,'3-4':24,'1-2':28};
function ladoNum(g,i){let p=g.split('-');return i==1?+p[0]:+p[1]}
let prods=[],lista=JSON.parse(localStorage.getItem('atacadao364_v56')||'[]'),pag=0,pp=40,atual=null;
function limparSujeira(){if(!confirm('Limpar?'))return;localStorage.clear();prods=[];lista=[];location.reload()}
function carregar(){let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('ADM_V73_6_PRATELEIRA_3A_28')||localStorage.getItem('ADM_V73_5_PAG_FIX_28')||'null')}catch(e){}if(!raw||!raw.length)raw=[];prods=raw.map(p=>{let g=(p.corredor||p.g||'25-26').toUpperCase(),x=MAP[g]||2,y=parseInt(p.y)||10,pos=p.pos||10,ld=p.lado||ladoNum(g,1),li=p.ladoIdx||(ld==ladoNum(g,1)?1:2),andar=p.andar||((pos%3)+1);return{x,y,pos,andar,nome:(p.nome||'').toUpperCase(),emo:p.emoji||p.emo||'📦',preco:String(p.preco||'').includes('R$')?p.preco:`R$ ${p.preco}`,g,lado:ld,ladoIdx:li}});render()}
function provocar(){if(!confirm('Criar 442 com 3 andares?'))return;let gond=Object.keys(MAP),nI=["WHEY","CREATINA","BCAA","BARRA","PASTA","AVENA","LEITE","IOGURTE","QUEIJO","FRANGO","OVO","ARROZ","FEIJAO","SARDINHA","ATUM","AZEITE","CAFE"],nP=["CHOC","FINI","REFRI","BISC","SORVETE","ACUCAR","OLEO","BOLACHA","SABONETE","DETERG","PAPEL","SHAMPOO","CREME","PASTA D","SABAO","AMACIAN","ESPONJA"],nov=[],id=0;for(let y=2;y<=19;y++){if(y==9)continue;let pos=y<=8?y-1:y-2;gond.forEach(g=>{let x=MAP[g],l1=ladoNum(g,1),l2=ladoNum(g,2);id++;nov.push({nome:nI[id%nI.length]+" "+g+" L"+l1+" POS"+pos+" A"+((id%3)+1)+" CENTRO",emoji:"💪",g,lado:l1,ladoIdx:1,preco:(Math.random()*20+5).toFixed(2),x,y,pos,andar:(id%3)+1});id++;nov.push({nome:nP[id%nP.length]+" "+g+" L"+l2+" POS"+pos+" A"+((id%3)+1)+" CENTRO",emoji:"🍫",g,lado:l2,ladoIdx:2,preco:(Math.random()*15+2).toFixed(2),x,y,pos,andar:(id%3)+1})})}localStorage.setItem(KEY,JSON.stringify(nov));carregar();alert('442 PISCA! Quando chegar abre botão!')}
function calc(){return lista.reduce((s,p)=>{let v=parseFloat(String(p.preco).replace('R$','').replace(',','.'));return isNaN(v)?s:s+v},0)}
let sv=null;function salvar(){clearTimeout(sv);sv=setTimeout(()=>{localStorage.setItem('atacadao364_v56',JSON.stringify(lista));document.getElementById('lista').innerHTML='💾 Salvo!';setTimeout(render,500)},200)}
function pagina(d){let m=Math.ceil(prods.length/pp)-1;pag+=d;if(pag<0)pag=0;if(pag>m)pag=m;render()}
function render(){let c=document.getElementById('prods');c.innerHTML='';let sl=prods.slice(pag*pp,(pag+1)*pp);let totalPag=Math.ceil(prods.length/pp)||12;document.getElementById('pgInfo').innerText=`PAG ${pag+1}/${totalPag}`;sl.forEach((p,iG)=>{let i=pag*pp+iG,sel=lista.find(l=>l.nome==p.nome),cor=p.ladoIdx==1?'#00d4ff':'#ff0',d=document.createElement('div');d.className='p'+(sel?' sel':'');d.innerHTML=`<div style="font-size:22px">${p.emo}</div><div style="font-size:7px;font-weight:bold">${p.nome}</div><div style="font-size:7px;color:#0f0">${p.preco}</div><div style="font-size:5px;background:${cor};color:#000;padding:1px;border-radius:3px;font-weight:900">[${p.g}] L${p.lado} P${p.pos} A${p.andar}</div><button onclick="tog(${i})">${sel?'✓':'ADD'}</button>`;c.appendChild(d)});document.getElementById('lista').innerHTML=lista.length==0?`✅ ${prods.length} prods - PAG ${pag+1}/${totalPag} - CHEGA = PISCA`:lista.map(l=>`${l.emo} ${l.nome} L${l.lado} P${l.pos} A${l.andar||1}`).join(' | ');document.getElementById('total').innerText=`TOTAL R$ ${calc().toFixed(2)} (${lista.length}) | PAG ${pag+1}/${totalPag}`;let cb=document.getElementById('combo');cb.innerHTML='';prods.forEach(p=>{let o=document.createElement('option');o.value=p.x+','+p.y;o.innerText=`${p.emo} ${p.nome} P${p.pos} A${p.andar}`;cb.appendChild(o)})}
function abrirPrat(g,pos){let gProds=prods.filter(p=>p.g==g && p.pos==pos);let l1=gProds.filter(p=>p.lado==ladoNum(g,1));let l2=gProds.filter(p=>p.lado==ladoNum(g,2));document.getElementById('pratTitle').innerText=`📦 ${g} POS ${pos}/17 - 3 ANDARES`;function renderAndar(list,containerId,g,lado){let cont=document.getElementById(containerId);cont.innerHTML='';for(let andar=3;andar>=1;andar--){let p=list.find(pp=>pp.andar==andar);if(p){cont.innerHTML+=`<div class="andar"><div class="info"><b>A${andar} ${andar==3?'🔝 TOPO':andar==2?'➡️ MEIO':'🔻 BAIXO'}</b><br>${p.emo} ${p.nome}<br><span style="color:#0f0">${p.preco}</span></div><div style="display:flex;flex-direction:column;gap:2px"><button onclick="togByName('${p.nome.replace(/'/g,"\\'")}')" style="background:#0f0;color:#000">ADD</button><button onclick="editByName('${p.nome.replace(/'/g,"\\'")}')" style="background:#ff0;color:#000">EDIT</button></div></div>`}else{cont.innerHTML+=`<div class="andar vazio"><div class="info"><b>A${andar} ${andar==3?'🔝 TOPO':andar==2?'➡️ MEIO':'🔻 BAIXO'}</b><br><span style="color:#666">VAZIO</span></div><button onclick="addNovo('${g}',${lado},${pos},${andar})" style="background:#00d4ff;color:#000">+ ADD</button></div>`}}}renderAndar(l1,'pratL1List',g,ladoNum(g,1));renderAndar(l2,'pratL2List',g,ladoNum(g,2));document.getElementById('pratModal').style.display='block';}
function abrirPratAtual(){if(!atual)return;abrirPrat(atual.g,atual.pos);}
function fecharPrat(){document.getElementById('pratModal').style.display='none';}
function togByName(nome){let p=prods.find(pp=>pp.nome==nome);if(!p)return;let ix=lista.findIndex(l=>l.nome==p.nome);if(ix>=0)lista.splice(ix,1);else lista.push({...p});salvar();render();}
function editByName(nome){let idx=prods.findIndex(p=>p.nome==nome);if(idx>=0){fecharPrat();editADM(idx);}}
function addNovo(g,lado,pos,andar){let nome=prompt(`Nome para ${g} L${lado} POS${pos} ANDAR ${andar}:`);if(!nome)return;let preco=prompt('Preço:')||'5.00';let emoji=prompt('Emoji:')||'📦';let x=MAP[g]||2;let y=pos<=8?pos+1:pos+2;if(y>=9)y++;prods.push({nome:nome.toUpperCase(),emo:emoji,g,lado,ladoIdx:lado==ladoNum(g,1)?1:2,preco,x,y,pos,andar});exportar();abrirPrat(g,pos);}
function tog(i){let p=prods[i],ix=lista.findIndex(l=>l.nome==p.nome);if(ix>=0)lista.splice(ix,1);else lista.push({...p});salvar();render()}
function limpar(){if(!confirm('Limpar?'))return;lista=[];localStorage.removeItem('atacadao364_v56');render()}
function irM(){if(!lista.length){alert('Add 1!');return}document.getElementById('tela1').style.display='none';document.getElementById('tela2').style.display='flex';init();resize();draw();loop();setTimeout(rota,300)}
function voltar(){document.getElementById('tela2').style.display='none';document.getElementById('tela1').style.display='flex';if(tm){clearInterval(tm);tm=null}document.getElementById('modal').style.display='none';fecharPrat();}
let lab=[],px=28,py=18,tx=28,ty=18,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0,vel=250;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let idxR=0,wait=false,ord=[];
function setV(v){vel=parseInt(v);if(vel<30)vel=30;if(vel>800)vel=800;document.getElementById('v').innerText='VEL '+vel+'ms';document.getElementById('sl').value=vel;if(tm){clearInterval(tm);tm=setInterval(step,vel)}}
function muda(d){setV(vel+d)}
function rota(){lista.forEach(l=>l.visitado=false);let r=[...lista],at={x:28,y:18},o=[];while(r.length){r.sort((a,b)=>(Math.abs(at.x-a.x)+Math.abs(at.y-a.y))-(Math.abs(at.x-b.x)+Math.abs(at.y-b.y)));let pr=r.shift();o.push(pr);at=pr}ord=o;idxR=0;prox()}
function prox(){if(idxR>=ord.length){document.getElementById('console').innerText='🎉 COMPLETA!';alert('FINALIZADO '+ord.length+' itens');return}ir(ord[idxR].x,ord[idxR].y)}
function show(it){atual=it;document.getElementById('mProd').innerText=it.emo;document.getElementById('mNome').innerText=it.nome;document.getElementById('mG').innerText=`G[${it.g}] X${it.x} Y${it.y} POS${it.pos}/17 A${it.andar||1}`;let ld=document.getElementById('mL');ld.innerText=`LADO ${it.lado} ${it.ladoIdx==1?'⬅️':'➡️'} POS ${it.pos}/17 A${it.andar||1}`;ld.style.background=it.ladoIdx==1?'#00d4ff':'#ff0';ld.style.color='#000';document.getElementById('mPreco').innerText=it.preco;document.getElementById('mProg').innerText=`${idxR+1}/${ord.length} P${it.pos}/17 A${it.andar||1}`;document.getElementById('btnPrat').style.display='block';document.getElementById('modal').style.display='block';}
function ok(){ord[idxR].visitado=true;document.getElementById('modal').style.display='none';document.getElementById('btnPrat').style.display='none';idxR++;wait=false;setTimeout(prox,400)}
function pular(){let it=ord[idxR];if(it)it.visitado=true;document.getElementById('modal').style.display='none';document.getElementById('btnPrat').style.display='none';wait=false;idxR++;setTimeout(prox,200)}
function init(){lab=[];for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==ROWS-1||x==0||x==COLS-1)lab[y][x]=0;else if(y==9)lab[y][x]=0;else if(x%2==1)lab[y][x]=1;else lab[y][x]=0}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}}}return[]}
function resize(){let r=cv.getBoundingClientRect();vw=r.width;vh=r.height||400;cv.width=vw;cv.height=vh;draw()}
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2;camX+=(tX-camX)*0.12;camY+=(tY-camY)*0.12;let mx=Math.max(0,COLS*W-vw),my=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(mx,camX));camY=Math.max(0,Math.min(my,camY))}
function draw(){updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(lab[y][x]==1){ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);ctx.fillStyle='#0f0';ctx.font='bold 7px monospace';ctx.textAlign='center';let n='';if(x==2)n='25-26';else if(x==4)n='23-24';else if(x==6)n='21-22';else if(x==8)n='19-20';else if(x==10)n='17-18';else if(x==12)n='15-16';else if(x==14)n='13-14';else if(x==16)n='11-12';else if(x==18)n='9-10';else if(x==20)n='7-8';else if(x==22)n='5-6';else if(x==24)n='3-4';else if(x==28)n='1-2';if(n)ctx.fillText(n,x*W+20,y*H+14)}else if(y==9){ctx.fillStyle='#333';ctx.fillRect(x*W,y*H,W,H);if(x%4==0){ctx.fillStyle='#ff0';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('3M',x*W+20,y*H+15)}}}for(let k in MAP){let x=MAP[k];ctx.fillStyle='#000';ctx.fillRect(x*W,0,W,12);ctx.fillStyle='#0f0';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText(k,x*W+20,8)}ctx.fillStyle='#0f0';ctx.fillRect(28*W,18*H,W,H);ctx.fillStyle='#000';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('ENTRADA',28*W+20,18*H+15);ctx.fillStyle='#ff0';ctx.fillRect(2*W,15*H,W,H);ctx.fillStyle='#000';ctx.fillText('25-26',2*W+20,15*H+15);for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle='rgba(0,255,136,'+(0.4+a*0.6)+')';ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill()}if(!(tx==28&&ty==18)){ctx.fillStyle='#f44';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4)}ord.forEach((it,i)=>{if(it.visitado||i<idxR)return;ctx.fillStyle=i==idxR?'#0f0':'#f44';ctx.beginPath();ctx.arc(it.x*W+20,it.y*H+13,i==idxR?11:7,0,6.28);ctx.fill();ctx.fillStyle=i==idxR?'#000':'#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.fillText(i+1,it.x*W+20,it.y*H+16);ctx.fillStyle=it.ladoIdx==1?'#00d4ff':'#ff0';ctx.font='bold 6px monospace';ctx.fillText('P'+it.pos+'A'+(it.andar||1), it.x*W+20, it.y*H+5)});ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(px*W+20,py*H+13,10,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();document.getElementById('pos').innerText=`X:${px} Y:${py}`;document.getElementById('console').innerText=ord.filter(l=>!l.visitado).length>0?`📍 ${idxR+1}/${ord.length} ${ord[idxR]?.nome} [${ord[idxR]?.g} L${ord[idxR]?.lado} P${ord[idxR]?.pos}/17 A${ord[idxR]?.andar||1}] CHEGOU = PISCA!`:'🎉 Pronto!';}
function step(){if(cam.length==0){clearInterval(tm);tm=null;let al=ord[idxR];if(al&&px==al.x&&py==al.y&&!al.visitado&&!wait){wait=true;show(al)}draw();return}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25)rastro.shift();px=p.x;py=p.y;draw()}
function mv(dx,dy){if(tm){clearInterval(tm);tm=null}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25)rastro.shift();px=nx;py=ny;draw()}
function ir(x,y){if(tm){clearInterval(tm);tm=null}x=Math.max(1,Math.min(COLS-2,parseInt(x)||28));y=Math.max(1,Math.min(ROWS-2,parseInt(y)||18));if(lab[y]&&lab[y][x]==1){if(x>0&&lab[y][x-1]!=1)x--;else if(x<COLS-1&&lab[y][x+1]!=1)x++}if(x==28&&y==18)rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){if(px!=x||py!=y){px=x;py=y}let al=ord[idxR];if(al&&px==al.x&&py==al.y&&!al.visitado&&!wait){wait=true;show(al)}draw();return}tm=setInterval(step,vel);draw()}
function loop(){updateCam();draw();requestAnimationFrame(loop)}
let editIdx=-1,curEL=1;function abrirADM(){document.getElementById('admPanel').style.display='block';renderADM()}function fecharADM(){document.getElementById('admPanel').style.display='none';carregar()}function renderADM(){let q=(document.getElementById('buscaADM').value||'').toLowerCase(),html='',fil=prods.filter(p=>p.nome.toLowerCase().includes(q));fil.slice(0,60).forEach(p=>{let idx=prods.indexOf(p),cor=p.ladoIdx==1?'#00d4ff':'#ff0';html+=`<div style="display:flex;justify-content:space-between;align-items:center;background:#000;padding:4px;margin:2px 0;border-radius:6px;border:1px solid #222;font-size:8px"><div style="flex:1">${p.emo} <b>${p.nome}</b><br><small style="background:${cor};color:#000;padding:1px 3px;border-radius:3px;font-weight:900">[${p.g}] L${p.lado} P${p.pos} A${p.andar}</small></div><div style="display:flex;gap:2px"><button onclick="editADM(${idx})" style="background:#0f0;color:#000;border:none;padding:3px 6px;border-radius:4px;font-weight:bold;font-size:8px">EDIT</button><button onclick="if(confirm('Apagar?')){prods.splice(${idx},1);exportar()}" style="background:#f00;color:#fff;border:none;padding:3px 5px;border-radius:4px;font-size:8px">X</button></div></div>`});document.getElementById('listaADM').innerHTML=html||'Vazio - clique 442'}function setEL(i){curEL=i;document.getElementById('eL1').style.background=i==1?'#0f0':'#000';document.getElementById('eL2').style.background=i==2?'#ff0':'#000';document.getElementById('eL1').style.color=i==1?'#000':'#0f0';document.getElementById('eL2').style.color=i==2?'#000':'#0f0'}function editADM(i){let p=prods[i];editIdx=i;document.getElementById('eNome').value=p.nome;document.getElementById('eEmoji').value=p.emo;document.getElementById('eG').value=p.g;document.getElementById('eX').value=p.x;document.getElementById('eY').value=p.y;document.getElementById('ePos').value=p.pos;document.getElementById('eAndar').value=p.andar||1;curEL=p.ladoIdx||1;setEL(curEL);document.getElementById('formEdit').style.display='block'}function cancelE(){document.getElementById('formEdit').style.display='none';editIdx=-1}function saveE(){if(editIdx<0)return;let g=(document.getElementById('eG').value||'25-26').toUpperCase(),x=MAP[g]||2,y=parseInt(document.getElementById('eY').value)||10,pos=parseInt(document.getElementById('ePos').value)||10,andar=parseInt(document.getElementById('eAndar').value)||1,lado=ladoNum(g,curEL);if(y==9)y=8;prods[editIdx]={nome:document.getElementById('eNome').value.toUpperCase(),emo:document.getElementById('eEmoji').value||'📦',g,lado,ladoIdx:curEL,preco:prods[editIdx].preco,x,y,pos,andar};exportar();cancelE();renderADM();render()}function exportar(){localStorage.setItem(KEY,JSON.stringify(prods));document.getElementById('msgADM').innerText='✅ '+prods.length+' salvos | V73.7 PISCA';carregar();renderADM()}
carregar();window.addEventListener('resize',resize);
document.getElementById('combo').addEventListener('change',()=>{let v=document.getElementById('combo').value.split(',');ir(parseInt(v[0]),parseInt(v[1]))});
