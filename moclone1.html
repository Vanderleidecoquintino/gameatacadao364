<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V12 DEMIX REAL FREE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-3"><div class="max-w-[480px] mx-auto">
<h1 class="bg-[#00ff88] text-black font-black p-3 rounded-xl text-center">V12 DEMIX REAL - FREE</h1>
<p class="text-[9px] text-zinc-500 text-center mt-2">IA do Facebook, grátis, sem cartão</p>
<input type="file" id="f" accept="audio/*" hidden>
<button onclick="f.click()" class="mt-4 w-full border-2 border-dashed border-[#00ff88] p-6 rounded-xl font-black">📁 MANDAR MP3/WAV</button>
<button id="btn" class="hidden mt-3 w-full bg-white text-black font-black h-14 rounded-xl">SEPARAR COM IA REAL</button>
<p id="st" class="text-[11px] text-zinc-400 mt-3 text-center bg-zinc-900 p-3 rounded-xl">Pronto</p>
<div id="out" class="mt-4 space-y-2"></div>
</div>
<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.9.4/dist/index.js";
let file=null;
f.onchange=e=>{file=e.target.files[0];document.getElementById('st').innerText=file.name;btn.classList.remove('hidden');}
btn.onclick=async()=>{
 btn.disabled=true; btn.innerText='CONECTANDO IA GRÁTIS...';
 document.getElementById('st').innerText='Conectando servidor grátis (pode demorar 40s na 1ª vez)...';
 try{
  const app=await Client.connect("facebook/demucs");
  document.getElementById('st').innerText='Separando com IA... 30-60s, não feche';
  btn.innerText='SEPARANDO...';
  const res=await app.predict("/predict",[file,"htdemucs"]);
  // res.data = [vocals, drums, bass, other]
  const labels=['VOZ','BATERIA','BAIXO','OUTROS'];
  document.getElementById('out').innerHTML=res.data.map((d,i)=>`
   <div class="bg-zinc-900 p-3 rounded-xl"><p class="text-[10px] font-black">${labels[i]||'FAIXA '+(i+1)}</p><audio controls class="w-full mt-2" src="${d.url||d}"></audio><a href="${d.url||d}" target="_blank" download="${labels[i]}.wav" class="mt-2 block bg-[#00ff88] text-black text-center py-2 rounded-lg text-[10px] font-black">BAIXAR ${labels[i]}</a></div>
  `).join('');
  document.getElementById('st').innerText='PRONTO! DEMIX REAL FEITO';
  btn.innerText='✅ FEITO';
 }catch(e){
  document.getElementById('st').innerText='Erro: '+e.message+' - tenta de novo, servidor grátis as vezes dorme';
  btn.innerText='TENTAR DE NOVO'; btn.disabled=false;
 }
}
</script></body></html>
