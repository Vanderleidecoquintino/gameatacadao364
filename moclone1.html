<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moises FREE</title></head>
<body style="background:#000;color:#fff;font-family:Arial;padding:10px">
<div style="max-width:400px;margin:auto">
<h2 style="background:#00ff88;color:#000;padding:10px;border-radius:10px;text-align:center">MOISES GRÁTIS - CLIQUE NO ARQUIVO</h2>
<input type="file" id="f" accept="audio/*" style="color:#fff;margin-top:20px;width:100%">
<div id="st" style="background:#222;padding:10px;border-radius:8px;margin-top:10px;font-size:12px">Nenhum arquivo</div>
<div id="out" style="margin-top:15px"></div>
</div>
<script>
f.onchange=async()=>{
 let file=f.files[0]; st.innerText=file.name;
 let ctx=new AudioContext(); let b=await file.arrayBuffer(); let a=await ctx.decodeAudioData(b);
 let L=a.getChannelData(0); let R=a.numberOfChannels>1?a.getChannelData(1):L; let len=a.length;
 let v=new Float32Array(len), i=new Float32Array(len);
 for(let n=0;n<len;n++){ v[n]=(L[n]+R[n])*0.5; i[n]=(L[n]-R[n])*0.5; }
 function url(d){
  let buf=new ArrayBuffer(44+d.length*2); let view=new DataView(buf);
  let w=(o,s)=>{for(let k=0;k<s.length;k++)view.setUint8(o+k,s.charCodeAt(k))};
  w(0,'RIFF'); view.setUint32(4,36+d.length*2,true); w(8,'WAVE'); w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,a.sampleRate,true); view.setUint32(28,a.sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); w(36,'data'); view.setUint32(40,d.length*2,true);
  let o=44; for(let k=0;k<d.length;k++){ let s=Math.max(-1,Math.min(1,d[k])); view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
 }
 let uv=url(v), ui=url(i);
 out.innerHTML='<audio controls src="'+uv+'" style="width:100%"></audio><a href="'+uv+'" download="voz.wav" style="display:block;background:#00ff88;color:#000;text-align:center;padding:10px;border-radius:8px;margin-top:5px;text-decoration:none;font-weight:bold">BAIXAR VOZ</a><audio controls src="'+ui+'" style="width:100%;margin-top:15px"></audio><a href="'+ui+'" download="instrumental.wav" style="display:block;background:#fff;color:#000;text-align:center;padding:10px;border-radius:8px;margin-top:5px;text-decoration:none;font-weight:bold">BAIXAR INSTRUMENTAL</a>';
 st.innerText='PRONTO - 2 faixas separadas';
};
</script></div></body></html>
