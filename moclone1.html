<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V99.2 VERTICAL</title></head><body style="background:#000;color:#fff;font-family:Arial;padding:10px"><div style="max-width:600px;margin:auto">
<h2 style="background:linear-gradient(90deg,#ff0033,#ffcc00,#00ff88);color:#000;padding:14px;border-radius:14px;text-align:center;font-weight:900">V99.2 - V95 + VERTICAL SLIDERS</h2>

</div><script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CHORD_NOTES={'C':['C','E','G'],'G':['G','B','D'],'Am':['A','C','E'],'F':['F','A','C'],'D':['D','F#','A'],'Em':['E','G','B'],'Dm':['D','F','A']};
const MAP={'C':['C','G','Am','F'],'G':['G','D','Em','C'],'A':['A','E','F#m','D']};
const NOTE_Y={'C':80,'D':70,'E':60,'F':55,'G':45,'A':35,'B':25};
let zoomP=1,followOn=true;let audios={},isSyncing=false;
function drawKeyboard(active){let h='<div style="display:flex;gap:2px;justify-content:center;background:#000;padding:8px;border-radius:10px">';['C','D','E','F','G','A','B','C'].forEach(n=>{let on=active.includes(n)||active.some(a=>a[0]==n);h+='<div style="width:36px;height:80px;background:'+(on?'#ffcc00':'#fff')+';border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:#000;font-size:10px;font-weight:900">'+n+'</div>'});return h+'</div>';}
function makeStaff(measures,curIdx){let W=measures.length*88+50,h='<div style="min-width:'+W+'px"><svg width="'+W+'" height="110"><text x="2" y="60" font-size="40">𝄞</text>';for(let i=0;i<measures.length;i++){let x=30+i*88,is=curIdx===i;h+='<rect x="'+x+'" y="0" width="82" height="100" fill="'+(is?'#00ff8844':'none')+'" stroke="'+(is?'#00ff88':'#ccc')+'" stroke-width="'+(is?'3':'1')+'" rx="8"/>';for(let l=0;l<5;l++)h+='<line x1="'+x+'" y1="'+(15+l*13*zoomP)+'" x2="'+(x+82)+'" y2="'+(15+l*13*zoomP)+'" stroke="#000" stroke-width="1"/>';h+='<text x="'+(x+6)+'" y="10" font-size:14" font-weight="900" fill="#000">'+measures[i].chord+'</text>';let y=NOTE_Y[measures[i].chord[0]]||60;h+='<ellipse cx="'+(x+30)+'" cy="'+y+'" rx="8" ry="5" fill="'+(is?'#00ff88':'#000')+'"/>';}return h+'</svg></div>';}
function v95Separate(L,R){let len=L.length,v=new Float32Array(len),d=new Float32Array(len),b=new Float32Array(len),o=new Float32Array(len);for(let i=0;i<len;i++){let mid=(L[i]+R[i])*0.5;let side=(L[i]-R[i])*0.5;let prev=i>0?(L[i-1]+R[i-1])*0.5:0;let reverbCut=mid-prev*0.35;v[i]=reverbCut*1.6;d[i]=side*1.4+(L[i]-prev)*0.6;let low=0;for(let k=0;k<5&&i-k>=0;k++)low+=(L[i-k]+R[i-k])*0.5;b[i]=(low/5)*1.8;o[i]=mid*0.3+side*0.4-v[i]*0.15;}for(let i=0;i<len;i++){o[i]-=v[i]*0.25;b[i]-=v[i]*0.1;if(v[i]>1)v[i]=1;if(v[i]<-1)v[i]=-1;}return{v,d,b,o};}
function playAll(){let t=audios['m']?audios['m'].currentTime:0;Object.values(audios).forEach(a=>{a.currentTime=t;});setTimeout(()=>{Object.values(audios).forEach(a=>a.play());},40);}
function pauseAll(){Object.values(audios).forEach(a=>a.pause());}
f.onchange=async()=>{let file=f.files[0];if(!file)return;st.innerText='Montando V99.2...';let ctx=new(window.AudioContext||window.webkitAudioContext)();let buf=await ctx.decodeAudioData(await file.arrayBuffer());let L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,len=buf.length,sr=buf.sampleRate;let step=Math.floor(sr*0.15),energies=[];for(let i=0;i<len;i+=step){let s=0;for(let j=0;j<step&&i+j<len;j++)s+=L[i+j]*L[i+j];energies.push(s);}let peaks=[];for(let i=1;i<energies.length-1;i++)if(energies[i]>energies[i-1]&&energies[i]>energies[i+1]&&energies[i]>0.02)peaks.push(i);let diffs=[];for(let i=1;i<peaks.length;i++)diffs.push(peaks[i]-peaks[i-1]);diffs.sort((a,b)=>a-b);let median=diffs[Math.floor(diffs.length/2)]||25;let bpm=Math.round(60/(median*0.15));if(bpm<60||bpm>200)bpm=120;let best=0,formula=4,label='4/4';[{f:3,l:'3/4'},{f:4,l:'4/4'}].forEach(t=>{let lag=Math.round((60/bpm*t.f)/0.15),sc=0;for(let i=0;i<energies.length-lag;i++)sc+=energies[i]*energies[i+lag];if(sc>best){best=sc;formula=t.f;label=t.l;}});let chroma=new Array(12).fill(0),len2=Math.min(len,sr*15);for(let i=0;i<len2;i+=Math.floor(sr*0.1))for(let pc=0;pc<12;pc++){let fr=130.81*Math.pow(2,pc/12),c=0;for(let k=0;k<100;k++){let idx=i+k*20;if(idx<len)c+=Math.abs(L[idx]*Math.sin(2*Math.PI*fr*(idx/sr)));}chroma[pc]+=c;}let mx=0,ki=0;for(let i=0;i<12;i++)if(chroma[i]>mx){mx=chroma[i];ki=i;}let tom=NOTES[ki];let prog=MAP[tom]||['C','G','Am','F'];let stems=v95Separate(L,R);function makeUrl(d){let ab=new ArrayBuffer(44+d.length*2),vw=new DataView(ab);let w=(o,s)=>{for(let k=0;k<s.length;k++)vw.setUint8(o+k,s.charCodeAt(k))};w(0,'RIFF');vw.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');vw.setUint32(16,16,true);vw.setUint16(20,1,true);vw.setUint16(22,1,true);vw.setUint32(24,sr,true);vw.setUint32(28,sr*2,true);vw.setUint16(32,2,true);vw.setUint16(34,16,true);w(36,'data');vw.setUint32(40,d.length*2,true);let o=44;for(let k=0;k<d.length;k++){let s=Math.max(-1,Math.min(1,d[k]));vw.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));}let urls={v:makeUrl(stems.v),d:makeUrl(stems.d),b:makeUrl(stems.b),o:makeUrl(stems.o),m:URL.createObjectURL(file)};let compassoSec=(60/bpm)*formula,total=Math.floor(buf.duration/compassoSec);let measures=[];for(let i=0;i<total&&i<48;i++)measures.push({chord:prog[i%prog.length],t:i*compassoSec});
document.getElementById('mesa').style.display='block';
document.getElementById('mesa').innerHTML='<div style="background:#111;padding:12px;border-radius:12px"><div style="display:flex;gap:6px;font-size:10px;flex-wrap:wrap;align-items:center"><span style="background:#ffcc00;color:#000;padding:4px 8px;border-radius:20px;font-weight:900">TOM '+tom+'</span><span style="background:#00ff88;color:#000;padding:4px 8px;border-radius:20px;font-weight:900">'+label+' BPM '+bpm+'</span><span style="background:#ff0033;color:#fff;padding:4px 8px;border-radius:20px;font-weight:900">V95 MOTOR</span><button onclick="playAll()" style="background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:900">▶️ PLAY</button><button onclick="pauseAll()" style="background:#ff6b6b;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900">⏸️ PAUSE</button></div><div id="tracks" style="margin-top:12px;display:flex;flex-direction:column;gap:10px"></div></div>';
let tracksDiv=document.getElementById('tracks');tracksDiv.innerHTML='';audios={};
let cfgList=[{id:'m',n:'🎵 ÁUDIO ORIGINAL COMPLETO',c:'#fff'},{id:'v',n:'🎤 VOZ - V95 REVERB CUT',c:'#00ff88'},{id:'d',n:'🥁 BATERIA',c:'#ff6b6b'},{id:'b',n:'🎸 BAIXO',c:'#6b6bff'},{id:'o',n:'🎹 RESTO (INSTRUMENTOS SEM VOZ)',c:'#ffcc00'}];
cfgList.forEach(cfg=>{
let div=document.createElement('div');
div.style.cssText='background:#000;padding:10px;border-radius:10px;border-left:4px solid '+cfg.c;
div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;font-weight:900;color:'+cfg.c+'">'+cfg.n+'</div><button id="solo_'+cfg.id+'" style="font-size:9px;background:#222;color:#ffcc00;border:1px solid #ffcc00;border-radius:4px;padding:2px 6px">SOLO</button></div><audio id="aud_'+cfg.id+'" controls src="'+urls[cfg.id]+'" style="width:100%;margin-top:6px"></audio><div style="display:flex;gap:8px;align-items:center;margin-top:6px;background:#111;padding:6px;border-radius:6px"><span style="font-size:10px;min-width:30px">VOL</span><input type="range" id="vol_'+cfg.id+'" min="0" max="100" value="'+(cfg.id=='m'?100:90)+'" style="flex:1;height:8px"><span id="volTxt_'+cfg.id+'" style="font-size:11px;font-weight:900;min-width:35px">90%</span><button id="mute_'+cfg.id+'" style="font-size:11px;background:#333;color:#fff;border:none;border-radius:6px;padding:4px 10px;min-width:60px">MUTE</button></div>';
tracksDiv.appendChild(div);
});
setTimeout(()=>{cfgList.forEach(cfg=>{
let a=document.getElementById('aud_'+cfg.id);audios[cfg.id]=a;a.volume=cfg.id=='m'?1:0.9;
a.addEventListener('seeked',()=>{if(isSyncing)return;isSyncing=true;let t=a.currentTime;Object.keys(audios).forEach(k=>{if(k!==cfg.id)audios[k].currentTime=t;});setTimeout(()=>isSyncing=false,120);});
let vol=document.getElementById('vol_'+cfg.id);let txt=document.getElementById('volTxt_'+cfg.id);txt.innerText=vol.value+'%';vol.oninput=()=>{a.volume=vol.value/100;txt.innerText=vol.value+'%';};
let mute=document.getElementById('mute_'+cfg.id);mute.onclick=()=>{a.muted=!a.muted;mute.innerText=a.muted?'UNMUTE':'MUTE';mute.style.background=a.muted?'#ff0000':'#333';};
let solo=document.getElementById('solo_'+cfg.id);solo.onclick=()=>{Object.keys(audios).forEach(k=>{audios[k].muted=(k!==cfg.id);let m=document.getElementById('mute_'+k);if(m){m.innerText=audios[k].muted?'UNMUTE':'MUTE';m.style.background=audios[k].muted?'#ff0000':'#333';}});a.muted=false;mute.innerText='MUTE';mute.style.background='#333';};
});},200);
document.getElementById('master').style.display='block';document.getElementById('master').innerHTML='<div style="color:#000;font-weight:900;font-size:12px;text-align:center">✅ V99.2 - MOTOR V95 + SLIDERS VERTICAL V97 + SYNC FIX</div>';
document.getElementById('keys').style.display='block';document.getElementById('partitura').style.display='block';document.getElementById('cifra').style.display='block';let cur=-1;function renderAll(idx){let chord=measures[idx]?.chord||prog[0],notes=CHORD_NOTES[chord]||[chord];document.getElementById('keys').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px"><div style="font-size:10px;color:#ffcc00;font-weight:900">🎹 '+chord+' = '+notes.join(' ')+'</div><div style="display:flex;gap:4px"><button onclick="zoomP=Math.max(0.5,zoomP-0.2);renderAll(cur)" style="font-size:9px;background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px">ZOOM -</button><button onclick="zoomP=Math.min(2,zoomP+0.2);renderAll(cur)" style="font-size:9px;background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px">ZOOM +</button><button onclick="followOn=!followOn;this.innerText=followOn?`FOLLOW ON`:`FOLLOW OFF`" style="font-size:9px;background:#6b6bff;color:#fff;border:none;padding:4px 8px;border-radius:4px">FOLLOW ON</button></div></div><div style="margin-top:6px">'+drawKeyboard(notes)+'</div>';document.getElementById('partitura').innerHTML=makeStaff(measures,idx);if(followOn)document.getElementById('partitura').scrollLeft=Math.max(0,idx*88-120);document.querySelectorAll('.c').forEach((el,i)=>{el.style.background=i===idx?'#00ff88':'#1a1a1a';el.style.color=i===idx?'#000':'#fff';});}let htmlC='';for(let i=0;i<measures.length;i++)htmlC+='<div class="c" style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:6px;text-align:center;cursor:pointer" onclick="Object.values(audios).forEach(a=>{a.currentTime='+measures[i].t+';});playAll()"><div style="font-size:7px;color:#666">C '+(i+1)+'</div><div style="font-size:16px;font-weight:900;color:#ffcc00">'+measures[i].chord+'</div></div>';document.getElementById('cifra').innerHTML='<div style="font-size:10px;color:#888">🎼 '+total+' compassos - clica pra ir</div><div style="margin-top:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px">'+htmlC+'</div>';renderAll(0);setTimeout(()=>{let m=audios['m'];if(m){m.ontimeupdate=()=>{let idx=Math.floor(m.currentTime/compassoSec);if(idx!==cur&&idx>=0&&idx<measures.length){cur=idx;renderAll(idx);}};}},500);st.innerText='✅ V99.2 PRONTA - VERTICAL + V95 MOTOR - TOM '+tom+' | '+label+' | BPM '+bpm;};
</script></body></html>
