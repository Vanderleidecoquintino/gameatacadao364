<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moises</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div class="max-w-[520px] mx-auto p-3">
<div class="bg-[#00ff88] text-black font-black p-3 rounded-2xl text-center">MOISES V7 FINAL - 6 FAIXAS</div>
<div class="bg-zinc-900 p-3 rounded-2xl mt-3">
<label class="text-[10px] font-bold text-zinc-400">SEU TOKEN (r8_...)</label>
<input id="token" type="password" placeholder="r8_..." class="w-full mt-1 bg-black border border-zinc-700 rounded-xl p-3 text-[12px]">
</div>
<input type="file" id="f" accept="audio/*" hidden>
<button onclick="document.getElementById('f').click()" class="mt-3 w-full border-2 border-dashed border-[#00ff88] p-5 rounded-2xl font-black">📁 MANDAR MÚSICA</button>
<button id="btn" class="hidden mt-3 w-full bg-white text-black font-black h-14 rounded-xl">☁️ SEPARAR EM 6 FAIXAS</button>
<p id="st" class="text-[11px] text-zinc-400 mt-3 text-center bg-zinc-900 p-3 rounded-xl">Aguardando...</p>
<div id="out" class="mt-4 space-y-2"></div>
</div>
<script>
const $=id=>document.getElementById(id);let audioFile=null;
$('token').value=localStorage.getItem('rep_token')||'';
$('token').oninput=()=>localStorage.setItem('rep_token',$('token').value.trim());
$('f').onchange=e=>{audioFile=e.target.files[0];$('st').innerText='Pronto: '+audioFile.name;$('btn').classList.remove('hidden');};
$('btn').onclick=async()=>{
 let TOKEN=$('token').value.trim();if(!TOKEN.startsWith('r8_')){alert('Cola token r8_');return;}
 if(!audioFile){alert('Manda música');return;}
 localStorage.setItem('rep_token',TOKEN);$('btn').disabled=true;$('btn').innerText='⏳ ENVIANDO...';
 try{
  let fd=new FormData();fd.append('file',audioFile);
  let up=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST',body:fd});
  let upJ=await up.json();let audioUrl=upJ.data.url;
  $('st').innerText='Criando job 6 stems...';
  const PROXY='https://proxy.cors.sh/';
  let cr=await fetch(PROXY+'https://api.replicate.com/v1/predictions',{method:'POST',headers:{'Authorization':'Token '+TOKEN,'Content-Type':'application/json','x-cors-api-key':'temp'},body:JSON.stringify({version:'22d91eb840c3a87d0feb6d407fa3027b5b41e389d97b21d2a6504ceeea4941b9',input:{audio:audioUrl,model:'htdemucs_6s',clip_mode:'rescale',shifts:1,stem:'all'}})});
  let cj=await cr.json();let id=cj.id;if(!id)throw JSON.stringify(cj);
  for(let i=0;i<80;i++){await new Promise(r=>setTimeout(r,3000));
   let r2=await fetch(PROXY+'https://api.replicate.com/v1/predictions/'+id,{headers:{'Authorization':'Token '+TOKEN,'x-cors-api-key':'temp'}});
   let j2=await r2.json();$('st').innerText=j2.status+' '+(j2.logs||'').slice(-80);
   if(j2.status==='succeeded'){let out=j2.output;let h='';for(let k in out){h+=`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between"><span class="text-[11px] font-black">${k.toUpperCase()}</span><a href="${out[k]}" target="_blank" class="bg-[#00ff88] text-black text-[11px] px-5 py-2 rounded-xl font-black">BAIXAR</a></div>`;}$('out').innerHTML=h;$('st').innerText='✅ 6 FAIXAS PRONTAS';$('btn').innerText='✅ PRONTO - MANDAR OUTRA';$('btn').disabled=false;return;}
   if(j2.status==='failed')throw j2.error;
  }
 }catch(e){$('st').innerText='ERRO: '+e;alert(e);$('btn').disabled=false;$('btn').innerText='TENTAR DE NOVO';}
};
</script></body></html>
