<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V88 MESA TURBO</title></head>
<body style="background:#000;color:#fff;font-family:Arial;padding:10px">
<div style="max-width:750px;margin:auto">
<h2 style="background:linear-gradient(90deg,#ff0033,#ffcc00,#00ff88);color:#000;padding:16px;border-radius:14px;text-align:center;font-weight:900">V88 MESA - LASCA TUDO - 4 CANAIS</h2>
<input type="file" id="f" accept="audio/*" style="width:100%;margin-top:12px;background:#222;padding:14px;border-radius:10px;border:2px solid #ff0033;color:#fff">
<div id="st" style="background:#1a1a1a;padding:12px;border-radius:8px;margin-top:10px;font-size:12px;border-left:5px solid #ff0033">Escolhe a braba pra lascar</div>
<div id="mesa" style="margin-top:12px;display:none"></div>
<div id="cifra" style="margin-top:12px;background:#111;padding:12px;border-radius:12px;display:none"></div>
</div>
<script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MAP={'C':['C','G','Am','F'],'G':['G','D','Em','C'],'D':['D','A','Bm','G']};
function turboSeparate(L,R){
 let len=L.length, v=new Float32Array(len), d=new Float32Array(len), b=new Float32Array(len), o=new Float32Array(len);
 for(let i=0;i<len;i++){ let mid=(L[i]+R[i])*0.5, side=(L[i]-R[i])*0.5; b[i]=((L[i]+(L[i-1]||0)+(L[i-2]||0))/3)*1.4; v[i]=mid*1.5-side*0.5; d[i]=side*0.9+(L[i]-L[Math.max(0,i-8)])*0.8; o[i]=side*0.6+mid*0.4; }
 return {v,d,b,o};
}
f.onchange=async()=>{
 let file=f.files[0]; if(!file) return;
 st.innerText='MESA TURBO LIGANDO... separando e montando faders...';
 let ctx=new (window.AudioContext||window.webkitAudioContext)(); let buf=await ctx.decodeAudioData(await file.arrayBuffer());
 let L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L, len=buf.length, sr=buf.sampleRate;
 // BPM + FORMULA
 let step=Math.floor(sr*0.15), energies=[]; for(let i=0;i<len;i+=step){ let s=0; for(let j=0;j<step&&i+j<len;j++) s+=L[i+j]*L[i+j]; energies.push(s); }
 let peaks=[]; for(let i=1;i<energies.length-1;i++) if(energies[i]>energies[i-1]&&energies[i]>energies[i+1]&&energies[i]>0.02) peaks.push(i);
 let diffs=[]; for(let i=1;i<peaks.length;i++) diffs.push(peaks[i]-peaks[i-1]); diffs.sort((a,b)=>a-b);
 let median=diffs[Math.floor(diffs.length/2)]||25; let bpm=Math.round(60/(median*0.15)); if(bpm<60||bpm>200) bpm=125;
 let best=0, formula=4, label='4/4'; [{f:3,l:'3/4'},{f:4,l:'4/4'}].forEach(t=>{ let lag=Math.round((60/bpm*t.f)/0.15), sc=0; for(let i=0;i<energies.length-lag;i++) sc+=energies[i]*energies[i+lag]; if(sc>best){best=sc; formula=t.f; label=t.l;} });
 // TOM
 let chroma=new Array(12).fill(0), len2=Math.min(len,sr*15); for(let i=0;i<len2;i+=Math.floor(sr*0.1)) for(let pc=0;pc<12;pc++){ let fr=130.81*Math.pow(2,pc/12), c=0; for(let k=0;k<100;k++){ let idx=i+k*20; if(idx<len) c+=Math.abs(L[idx]*Math.sin(2*Math.PI*fr*(idx/sr))); } chroma[pc]+=c; }
 let mx=0, ki=7; for(let i=0;i<12;i++) if(chroma[i]>mx){mx=chroma[i]; ki=i;} let tom=NOTES[ki]; let prog=MAP[tom]||['C','G','Am','F'];
 let stems=turboSeparate(L,R);
 function makeUrl(d){ let ab=new ArrayBuffer(44+d.length*2), vw=new DataView(ab); let w=(o,s)=>{for(let k=0;k<s.length;k++)vw.setUint8(o+k,s.charCodeAt(k))}; w(0,'RIFF'); vw.setUint32(4,36+d.length*2,true); w(8,'WAVE'); w(12,'fmt '); vw.setUint32(16,16,true); vw.setUint16(20,1,true); vw.setUint16(22,1,true); vw.setUint32(24,sr,true); vw.setUint32(28,sr*2,true); vw.setUint16(32,2,true); vw.setUint16(34,16,true); w(36,'data'); vw.setUint32(40,d.length*2,true); let o=44; for(let k=0;k<d.length;k++){ let s=Math.max(-1,Math.min(1,d[k])); vw.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; } return URL.createObjectURL(new Blob([ab],{type:'audio/wav'})); }
 let urls={v:makeUrl(stems.v),d:makeUrl(stems.d),b:makeUrl(stems.b),o:makeUrl(stems.o)};
 let compassoSec=(60/bpm)*formula, total=Math.floor(buf.duration/compassoSec);
 // MESA HTML
 document.getElementById('mesa').style.display='block';
 document.getElementById('mesa').innerHTML=`
 <div style="background:#111;padding:12px;border-radius:12px;border:1px solid #333">
 <div style="display:flex;justify-content:space-between;font-size:11px"><span style="background:#ffcc00;color:#000;padding:3px 8px;border-radius:20px;font-weight:900">TOM ${tom}</span><span style="background:${formula==3?'#ff6b6b':'#00ff88'};color:#000;padding:3px 8px;border-radius:20px;font-weight:900">${label} | BPM ${bpm}</span><span style="background:#222;padding:3px 8px;border-radius:20px">${total} compassos</span></div>
 <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px" id="players">
  ${['v','d','b','o'].map((k,i)=>{
   let cfg={v:{n:'🎤 VOZ',c:'#00ff88'},d:{n:'🥁 BATERIA',c:'#ff6b6b'},b:{n:'🎸 BAIXO',c:'#6b6bff'},o:{n:'🎹 RESTO',c:'#ffcc00'}}[k];
   return `<div style="background:#000;padding:10px;border-radius:10px;border-left:4px solid ${cfg.c}"><div style="font-size:11px;font-weight:900;color:${cfg.c}">${cfg.n}</div><audio id="aud_${k}" controls src="${urls[k]}" style="width:100%;margin-top:6px"></audio><input type="range" id="vol_${k}" min="0" max="100" value="80" style="width:100%;margin-top:6px;accent-color:${cfg.c}"><div style="display:flex;gap:4px;margin-top:6px"><button id="mute_${k}" style="flex:1;background:#222;color:#fff;border:none;padding:6px;border-radius:20px;font-size:10px;font-weight:900">MUTE</button><button id="solo_${k}" style="flex:1;background:${cfg.c};color:#000;border:none;padding:6px;border-radius:20px;font-size:10px;font-weight:900">SOLO</button></div></div>`;
  }).join('')}
 </div>
 <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
  <button onclick="document.querySelectorAll('audio').forEach(a=>{a.currentTime=document.getElementById('aud_v').currentTime; a.play()})" style="background:#00ff88;color:#000;border:none;padding:10px;border-radius:10px;font-weight:900;font-size:12px">▶️ PLAY TUDO JUNTO</button>
  <button onclick="document.querySelectorAll('audio').forEach(a=>a.pause())" style="background:#ff6b6b;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:900;font-size:12px">⏸️ PAUSA TUDO</button>
  <button onclick="document.querySelectorAll('input[type=range]').forEach(r=>r.value=80); document.querySelectorAll('audio').forEach(a=>a.volume=0.8)" style="background:#ffcc00;color:#000;border:none;padding:10px;border-radius:10px;font-weight:900;font-size:12px">🔄 RESET MESA</button>
 </div>
 <div style="margin-top:8px;font-size:10px;color:#666;text-align:center">DICA DE PROF: Muta a voz pra aluno cantar | Muta o baixo pra aluno de baixo tocar | Solo bateria pra ensinar ritmo ${label}</div>
 </div>`;

 // CONTROLES
 ['v','d','b','o'].forEach(k=>{
  let aud=document.getElementById('aud_'+k), vol=document.getElementById('vol_'+k), mute=document.getElementById('mute_'+k), solo=document.getElementById('solo_'+k);
  vol.oninput=()=>aud.volume=vol.value/100;
  mute.onclick=()=>{ aud.volume=aud.volume>0?0:vol.value/100; mute.innerText=aud.volume==0?'UNMUTE':'MUTE'; mute.style.background=aud.volume==0?'#ff0033':'#222'; };
  solo.onclick=()=>{ document.querySelectorAll('audio').forEach(a=>a.volume=0); aud.volume=vol.value/100; document.querySelectorAll('[id^=mute_]').forEach(m=>m.innerText='MUTE'); };
 });
 // SINCRONIA
 let master=document.getElementById('aud_v');
 master.ontimeupdate=()=>{ if(!master.paused) ['d','b','o'].forEach(k=>{ let a=document.getElementById('aud_'+k); if(Math.abs(a.currentTime-master.currentTime)>0.15) a.currentTime=master.currentTime; }); };
 // CIFRA
 let html=''; for(let i=0;i<total&&i<80;i++){ let t=i*compassoSec, nm=prog[i%prog.length]; html+='<div class="c" data-t="'+t+'" style="background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px;text-align:center;cursor:pointer" onclick="document.getElementById(\'aud_v\').currentTime='+t+'; document.querySelectorAll(\'audio\').forEach(a=>{a.currentTime='+t+'; a.play()})"><div style="font-size:8px;color:#666">COMP '+(i+1)+'</div><div style="font-size:18px;font-weight:900;color:#ffcc00">'+nm+'</div></div>'; }
 document.getElementById('cifra').style.display='block'; document.getElementById('cifra').innerHTML='<div style="font-size:11px;color:#888">CIFRA NO COMPASSO - CLICA E A MESA PULA JUNTO</div><div style="margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+html+'</div>';
 st.innerText='V88 MESA TURBO PRONTA - '+label+' | TOM '+tom+' | BPM '+bpm+' | 4 CANAIS ATIVOS - LASCA!';
};
</script></body></html>
