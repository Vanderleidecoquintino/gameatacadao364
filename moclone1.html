<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V97.1 SYNC FIX</title></head>
<body style="background:#000;color:#fff;font-family:Arial;padding:10px">
<div style="max-width:850px;margin:auto">
<h2 style="background:#00ff88;color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900">V97.1 - SYNC FIXADO</h2>
<input type="file" id="f" accept="audio/*" style="width:100%;margin-top:10px;background:#222;padding:10px;border-radius:10px;border:2px solid #00ff88;color:#fff">
<div id="st" style="background:#1a1a1a;padding:8px;border-radius:8px;margin-top:8px;font-size:11px;border-left:4px solid #00ff88">Sync fixado - um comando controla todos</div>
<div id="ctrl" style="margin-top:10px;background:#111;padding:10px;border-radius:12px;display:none"></div>
<div id="mesa" style="margin-top:10px;display:none"></div>
</div>
<script>
let ctx, buffers={}, gains={}, masterTime=0, isPlaying=false, timer=null, duration=0, sr=44100;
function makeBuf(data){ let b=ctx.createBuffer(1,data.length,sr); b.copyToChannel(data,0); return b; }
function turbo(L,R){ let len=L.length,v=new Float32Array(len),d=new Float32Array(len),b=new Float32Array(len),o=new Float32Array(len); for(let i=0;i<len;i++){ let m=(L[i]+R[i])*0.5,s=(L[i]-R[i])*0.5; b[i]=(L[i]+(L[i-1]||0))*0.65; v[i]=m*1.2; d[i]=s*0.9; o[i]=s*0.4+m*0.3; } return {v,d,b,o,m:L}; }
f.onchange=async()=>{
 let file=f.files[0]; if(!file) return; st.innerText='Separando...';
 ctx=new (window.AudioContext||window.webkitAudioContext)(); sr=ctx.sampleRate;
 let ab=await file.arrayBuffer(); let audioBuf=await ctx.decodeAudioData(ab.slice(0)); duration=audioBuf.duration;
 let L=audioBuf.getChannelData(0), R=audioBuf.numberOfChannels>1?audioBuf.getChannelData(1):L;
 let stems=turbo(L,R);
 ['m','v','d','b','o'].forEach(k=>{ let d=k==='m'?L:stems[k]; buffers[k]=makeBuf(d); });
 document.getElementById('ctrl').style.display='block';
 document.getElementById('ctrl').innerHTML='<div style="display:flex;gap:6px"><button id="play" style="flex:1;background:#00ff88;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:16px">▶️ PLAY TUDO</button><button id="pause" style="flex:1;background:#ff6b6b;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:900">⏸️ PAUSA</button></div><input id="seek" type="range" min="0" max="100" value="0" style="width:100%;margin-top:8px"><div id="time" style="font-size:10px;text-align:center;color:#888">0:00 / '+Math.floor(duration/60)+':'+String(Math.floor(duration%60)).padStart(2,'0')+'</div>';
 document.getElementById('mesa').style.display='block';
 document.getElementById('mesa').innerHTML=['m','v','d','b','o'].map(k=>{
   let cfg={m:{n:'🎵 MASTER ORIGINAL',c:'#fff'},v:{n:'🎤 VOZ',c:'#00ff88'},d:{n:'🥁 BATERIA',c:'#ff6b6b'},b:{n:'🎸 BAIXO',c:'#6b6bff'},o:{n:'🎹 RESTO',c:'#ffcc00'}}[k];
   return '<div style="background:#111;padding:8px;border-radius:10px;margin-top:6px;border-left:4px solid '+cfg.c+';display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-size:10px;font-weight:900;color:'+cfg.c+'">'+cfg.n+'</div><input id="vol_'+k+'" type="range" min="0" max="100" value="'+(k==='m'?100:80)+'" style="width:100%"></div><button id="mute_'+k+'" style="background:#333;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:10px">MUTE</button><span id="txt_'+k+'" style="font-size:10px;min-width:30px">80%</span></div>';
 }).join('');
 let sources={}, startAt=0;
 function stopAll(){ Object.values(sources).forEach(s=>{try{s.stop()}catch(e){}}); sources={}; if(timer) clearInterval(timer); }
 function playFrom(t){
   stopAll(); startAt=ctx.currentTime - t; masterTime=t; isPlaying=true;
   Object.keys(buffers).forEach(k=>{
     let s=ctx.createBufferSource(); s.buffer=buffers[k]; let g=ctx.createGain(); 
     gains[k]=g; s.connect(g).connect(ctx.destination); 
     let volEl=document.getElementById('vol_'+k); let vol=volEl?volEl.value/100:0.8; g.gain.value= k==='m' ? vol : vol*0.8;
     try{ s.start(0, t); }catch(e){} sources[k]=s;
   });
   timer=setInterval(()=>{ if(!isPlaying) return; let cur=ctx.currentTime - startAt; if(cur>=duration){ pauseAll(); return; } masterTime=cur; document.getElementById('seek').value=(cur/duration)*100; document.getElementById('time').innerText=Math.floor(cur/60)+':'+String(Math.floor(cur%60)).padStart(2,'0')+' / '+Math.floor(duration/60)+':'+String(Math.floor(duration%60)).padStart(2,'0'); },100);
 }
 function pauseAll(){ stopAll(); isPlaying=false; }
 document.getElementById('play').onclick=()=>{ if(ctx.state==='suspended') ctx.resume(); playFrom(masterTime); };
 document.getElementById('pause').onclick=pauseAll;
 document.getElementById('seek').oninput=(e)=>{ let t=(e.target.value/100)*duration; masterTime=t; if(isPlaying) playFrom(t); };
 ['m','v','d','b','o'].forEach(k=>{
   let vol=document.getElementById('vol_'+k); let txt=document.getElementById('txt_'+k); let mute=document.getElementById('mute_'+k);
   if(vol) vol.oninput=()=>{ let v=vol.value/100; if(gains[k]) gains[k].gain.value=v; if(txt) txt.innerText=vol.value+'%'; };
   if(mute) mute.onclick=()=>{ if(!gains[k]) return; let isMuted=gains[k].gain.value===0; gains[k].gain.value=isMuted? (vol.value/100) : 0; mute.innerText=isMuted?'MUTE':'UNMUTE'; mute.style.background=isMuted?'#333':'#ff0000'; };
   if(txt) txt.innerText=vol.value+'%';
 });
 st.innerText='V97.1 PRONTA - SYNC 100% - Agora um relógio só controla todos os 5 tracks';
};
</script>
</body></html>
