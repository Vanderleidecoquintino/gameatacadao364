<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BACKEND COM LEITOR</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
.top{position:sticky;top:0;background:#111;padding:10px;z-index:10;border-bottom:3px solid #ff0}
input,button{width:100%;height:58px;border-radius:12px;border:0;font-weight:900;padding:0 15px;box-sizing:border-box;font-size:18px;margin:5px 0}
button{background:#ff0;color:#000}
.azul{background:#00ccff}
.verde{background:#00ff88}
.bip{background:#fff;color:#000;border-radius:15px;padding:15px;margin:10px;text-align:center;font-weight:900;box-shadow:0 0 20px #ff0}
.bip svg{width:100%;max-width:380px;height:90px}
#leitor{width:100%;border-radius:15px;overflow:hidden;display:none;border:3px solid #ff0}
#leitor video{width:100%}
</style>
</head><body>
<div class=top>
<h2 style="color:#ff0;text-align:center;margin:0">💛 BACKEND + LEITOR + BIPADOR 💛</h2>

<input id=n placeholder="NOME EX: MANGA PALMER">
<input id=c placeholder="CODIGO" inputmode="numeric">
<button onclick=add()>+ SALVAR DO CADERNO</button>
<button class=verde onclick=exportar()>⬇️ BAIXAR LISTA.HTML</button>

<button class=azul onclick="abrirLeitor()">📷 ABRIR LEITOR DE CAMERA</button>
<button class=azul onclick="fecharLeitor()" style="background:#ff4444;color:#fff;display:none" id=btnFechar>❌ FECHAR CAMERA</button>

<div id=leitor></div>
<div id=resultado style="text-align:center;color:#00ff88;font-weight:900;padding:8px"></div>

<hr>
<input id=s placeholder="🔍 OU DIGITE PRA BIPAR" oninput=bipar() style="border:3px solid #ff0">
<div id=cont style="text-align:center;color:#ff0;font-weight:900"></div>
</div>

<div id=visor></div>

<script>
let P=JSON.parse(localStorage.getItem('produtos_bip'))||[["MAÇA DIVERTIDA BOA ROCA","000173"],["CARA PAULISTA","1917949"],["JILO","1499938"],["CEBOLA ROXA","36041605"],["MANDIOCA AIPIM","1506929"],["CEBOLA ATACADAO","14692998"],["MANDIOQUINHA","1504910"],["CEBOLA PALITO","262216"],["MAXIXE","4779949"],["CENOURA","19020905"],["PEPINO COMUM","1514008"],["CHUCHU","19020990"],["PEPINO JAPONES","1516925"],["GENGIBRE","1497919"],["PEPINO CAIPIRA","1525"],["INHAME DA COSTA","19029962"],["PIMENTA CAMBUCI","9147999"],["ABOBORA ITALIANA","1688"],["ABOBORA JAP/CABOTIA","1894905"],["ABOBORA PTA JACAR.","2093926"],["ABOBORA SECA","1893"],["ABOBORA BRASILEIRA","1892"],["ABOBORA BATA","64782905"],["ABOBORA MORANGA","1896924"],["ALHO KG A GRANEL","21933966"],["BATATA LAVADA","14691938"],["BATATA ASTERIX","3023977"],["BATATA BOLINHA","14863922"],["BATATA DOCE","1908912"],["BETERRABA","1616916"],["BERINJELA COMUM","1900931"],["ABACATE","1632935"],["AVOCADO","4614874"],["AMEIXA NACIONAL","1637"],["AMEIXA IMPORTADA","5606912"],["ATEMOIA","35858"],["BANANA NANICA","1643973"],["BANANA PRATA","1640951"],["BANANA MACA","1661910"],["BANANA TERRA","4606915"],["CAQUI FUYU","21843"],["CAQUI RAMA FORTE","21700"],["CARAMBOLA","9109927"],["CEREJA","20914"],["COCO SECO TROPIC","1650967"],["GOIABA BRANCA TROPIC","1773999"],["GOIABA VERM TROPICAL","9009993"],["KIWI","1768974"],["KIWI SUN GOLD","73384961"],["LARANJA PERA GRANEL","11672947"],["HF.LARANJA LIMA","1494"],["LARANJA IMPORTADA","8353964"],["LIMAO TAITI TROPICAL","1805943"],["LIMAO SICILIANO","53849902"],["MACA RED IMPORT","1819977"],["MACA NAC FUJI","1827936"],["MACA NAC GALA","1825917"],["MACA VERDE IMPORT","5603934"],["MAMAO FORMOSA","4786949"],["MAMAO COMUM","1816999"],["MAMAO HAWAI/PAPAYA","1815539"]];
let html5QrcodeScanner=null;
function save(){localStorage.setItem('produtos_bip',JSON.stringify(P))}
function add(){let no=n.value.toUpperCase().trim(),co=c.value.trim();if(!no||!co)return alert('Preencha!');P.push([no,co]);P.sort((a,b)=>a[0].localeCompare(b[0]));save();n.value='';c.value='';bipar()}
function bipar(){
let q=s.value.toUpperCase().trim();
let achados=q==''?P:P.filter(x=>x[0].includes(q)||x[1].includes(q));
cont.innerText=achados.length+' produtos';
visor.innerHTML=achados.map((p,i)=>`<div class=bip>⭐ ${p[0]} ⭐<br><svg id=b${i}></svg><br>📦 ${p[1]}</div>`).join('');
setTimeout(()=>{achados.forEach((p,i)=>{try{JsBarcode('#b'+i,String(p[1]),{format:'CODE128',width:2.5,height:80,displayValue:false})}catch(e){}})},100);
}
function abrirLeitor(){
document.getElementById('leitor').style.display='block';
document.getElementById('btnFechar').style.display='block';
html5QrcodeScanner=new Html5Qrcode("leitor");
html5QrcodeScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decodificado)=>{
document.getElementById('resultado').innerText='BIPOU: '+decodificado;
s.value=decodificado;
bipar();
let audio=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');audio.play();
},{});
}
function fecharLeitor(){
if(html5QrcodeScanner){html5QrcodeScanner.stop().then(()=>{document.getElementById('leitor').style.display='none';document.getElementById('btnFechar').style.display='none';document.getElementById('leitor').innerHTML='';});}
}
function exportar(){
let itens=P.map(p=>`{n:"${p[0]}",c:"${p[1]}"},`).join('');
let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LISTA</title><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script><style>body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}.top{position:sticky;top:0;background:#000;padding:10px}input{width:95%;height:60px;border-radius:12px;border:0;font-weight:900;font-size:22px;padding:0 15px}button{width:95%;height:55px;border-radius:12px;border:0;background:#00ccff;font-weight:900;margin:6px 0}.item{background:#fff;color:#000;border-radius:20px;padding:18px;margin:12px 0;font-weight:900;box-shadow:0 0 15px #ff0}svg{width:100%;height:90px}#leitor{width:95%;margin:auto;border-radius:15px;overflow:hidden;display:none;border:3px solid #ff0}<\/style></head><body><div class=top><h2 style=color:#ff0>💛 BIPADOR LINDO + LEITOR 💛</h2><button onclick="abrir()">📷 ABRIR LEITOR CAMERA</button><div id=leitor></div><input id=s placeholder="🔍 OU DIGITE..." oninput="f()"></div><div id=l></div><script>let D=[${itens}];let qr=null;function abrir(){document.getElementById('leitor').style.display='block';qr=new Html5Qrcode("leitor");qr.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{s.value=txt;f();qr.stop();document.getElementById('leitor').style.display='none';});}function f(){let q=s.value.toUpperCase(),h='';D.forEach((p,i)=>{if(!q||p.n.includes(q)||p.c.includes(q)){h+='<div class=item>⭐ '+p.n+' ⭐<br><svg id=i'+i+'></svg><br>📦 '+p.c+'</div>'}});l.innerHTML=h;setTimeout(()=>{D.forEach((p,i)=>{let e=document.getElementById('i'+i);if(e)try{JsBarcode(e,p.c,{format:'CODE128',width:2.5,height:80,displayValue:false})}catch(e){}})},100)}f();<\/script></body></html>`;
let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lista.html';a.click();
}
bipar();
</script></body></html>
