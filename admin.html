<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM V65 POS1 CAIXA</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px;max-width:480px;margin:auto}input{width:100%;padding:12px;margin:4px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px}.b{padding:10px;border:1px solid #0f0;border-radius:8px;background:#000;color:#0f0;font-weight:bold}.card{background:#111;padding:10px;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between;border:1px solid #222}#formEdit{display:none;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#222;padding:15px;border:2px solid #0f0;border-radius:15px 15px 0 0;z-index:10}#mapa{width:100%;height:500px;border:2px solid #0f0;position:relative;background:#000;margin:8px 0;border-radius:10px;overflow:hidden}.gondola{position:absolute;background:#1e40af;border:1px solid #00d4ff;opacity:.6;box-sizing:border-box}.ponto{position:absolute;transform:translate(-50%,-50%);font-size:13px;z-index:2}.label{position:absolute;font-size:8px;color:#fff;z-index:4;background:#000;padding:2px 3px;border:1px solid #0f0}</style></head><body>
<h3>ADM V65 POS1=CAIXA <span id="total">0</span></h3><input id="busca" placeholder="BUSCAR POSICAO" oninput="render()"><div style="display:flex;gap:5px"><button class="b" style="flex:1;background:#0f0;color:#000" onclick="exportar()">💾 SALVAR</button><button class="b" style="flex:1" onclick="render()">🔄 GRADE</button><button class="b" style="color:red" onclick="limpar()">RESET</button></div><div id="lista"></div><div id="mapa"></div><div id="msg"></div>
<div id="formEdit"><h4 id="t"></h4><input id="f_nome"><input id="f_emoji"><div style="display:flex;gap:6px"><input id="f_g"><input id="f_preco"></div><div style="display:flex;gap:6px"><input id="f_x" type="number" placeholder="X"><input id="f_y" type="number" placeholder="Y POS INVERSO"></div><div style="display:flex;gap:6px;margin-top:8px"><button class="b" style="flex:1" onclick="closeForm()">CANCELAR</button><button class="b" style="flex:1;background:#0f0;color:#000" onclick="salvar()">SALVAR</button></div></div>
<script>
const COLS=27,ROWS=19,KEY='ADM_V615_FIX';
const MAP_G={"25-26":1,"23-24":3,"21-22":5,"19-20":7,"17-18":9,"15-16":11,"13-14":13,"11-12":15,"9-10":17,"7-8":19,"5-6":21,"3-4":23,"1-2":25};
let produtos=[];try{produtos=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){produtos=[]}
let edit=-1;
function limpar(){if(confirm('RESET?')){localStorage.clear();produtos=[];render();}}
function render(){
 let q=(document.getElementById('busca').value||'').toLowerCase();
 let html='';let filtro=produtos.filter(p=>p.nome.toLowerCase().includes(q));
 filtro.forEach(p=>{
  let posDa26 = 17 - p.y; // Y16=Pos1, Y1=Pos16
  if(p.g!="25-26") posDa26 = "-";
  let idx=produtos.indexOf(p);
  html+=`<div class="card"><div> ${p.emoji} <b style="font-size:11px">${p.nome}</b><br><small style="background:#0f0;color:#000;padding:2px 4px;border-radius:4px">${p.g} X:${p.x} Y:${p.y} POS26:${posDa26}</small> R$${p.preco}</div><div><button class="b" onclick="editar(${idx})">EDIT</button> <button class="b" style="color:red" onclick="apagar(${idx})">X</button></div></div>`;
 });
 document.getElementById('lista').innerHTML=html||'<div style="text-align:center;padding:20px">Seus produtos já estão salvos!</div>';
 document.getElementById('total').innerText=produtos.length;
 let m=document.getElementById('mapa');m.innerHTML='';
 for(let y=0;y<ROWS;y++){for(let x=0;x<COLS;x++){if(x%2==1 || y==0 || y==8 || y==9 || y==18 || x==0 || x==26){let d=document.createElement('div');d.className='gondola';d.style.left=(x/COLS*100)+'%';d.style.top=(y/ROWS*100)+'%';d.style.width=(100/COLS)+'%';d.style.height=(100/ROWS)+'%';m.appendChild(d);}}}
 Object.keys(MAP_G).forEach(g=>{let d=document.createElement('div');d.className='label';d.style.left=(MAP_G[g]/COLS*100)+'%';d.style.top='2%';d.textContent=g;m.appendChild(d);});
 produtos.forEach(p=>{let d=document.createElement('div');d.className='ponto';d.style.left=(p.x/COLS*100)+'%';d.style.top=(p.y/ROWS*100)+'%';d.textContent=p.emoji;m.appendChild(d);});
 // Marca POS 1 CAIXA
 let caixa=document.createElement('div');caixa.style.position='absolute';caixa.style.left=(2/COLS*100)+'%';caixa.style.top=(16/ROWS*100)+'%';caixa.style.width=(100/COLS)+'%';caixa.style.height=(100/ROWS)+'%';caixa.style.border='2px solid #ffff00';caixa.style.background='rgba(255,255,0,0.4)';caixa.style.zIndex='5';m.appendChild(caixa);
 let lbl=document.createElement('div');lbl.className='label';lbl.style.left=(2/COLS*100)+'%';lbl.style.top=(16/ROWS*100)+'%';lbl.style.background='#ffff00';lbl.style.color='#000';lbl.textContent='POS1 26 CAIXA';lbl.style.zIndex='6';m.appendChild(lbl);
}
function editar(i){edit=i;let p=produtos[i];document.getElementById('t').innerText='EDITAR '+p.nome+' POS26 '+(17-p.y);document.getElementById('f_nome').value=p.nome;document.getElementById('f_emoji').value=p.emoji;document.getElementById('f_g').value=p.g;document.getElementById('f_preco').value=p.preco;document.getElementById('f_x').value=p.x;document.getElementById('f_y').value=p.y;document.getElementById('formEdit').style.display='block';}
function closeForm(){document.getElementById('formEdit').style.display='none';}
function salvar(){let p={nome:document.getElementById('f_nome').value.toUpperCase()||'PRODUTO',emoji:document.getElementById('f_emoji').value||'📦',g:document.getElementById('f_g').value||'25-26',preco:document.getElementById('f_preco').value||'9.90',x:parseInt(document.getElementById('f_x').value)||2,y:parseInt(document.getElementById('f_y').value)||16};if(edit>=0)produtos[edit]=p;else produtos.push(p);closeForm();exportar();}
function apagar(i){if(confirm('Apagar?')){produtos.splice(i,1);exportar();}}
function exportar(){localStorage.setItem(KEY,JSON.stringify(produtos));localStorage.setItem('atacadao364_FINAL',JSON.stringify(produtos));localStorage.setItem('produtos',JSON.stringify(produtos));document.getElementById('msg').innerText='✅ '+produtos.length+' salvos | POS1=CAIXA Y16';render();}
render();
</script></body></html>
