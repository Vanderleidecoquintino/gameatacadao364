function carregar40Demo(){
  if(confirm('Carregar 40 produtos demo? Vai adicionar aos existentes.')){
    produtos = produtos.concat(PRODUTOS_40_DEMO);
    exportar();
    alert('40 PRODUTOS DEMO CARREGADOS! Total: '+produtos.length);
  }
}
function limparDemo(){
  if(confirm('Limpar tudo?')){ produtos=[]; exportar(); }
}

function render(){
  const q=document.getElementById('busca').value.toLowerCase();
  const filtered=produtos.map((p,i)=>({...p,_i:i})).filter(p=>p.nome.toLowerCase().includes(q));
  document.getElementById('lista').innerHTML=filtered.map(p=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:22px">${p.emoji}</span><div><b>${p.nome}</b><br><small style="background:#00ff88;color:#000;padding:2px;border-radius:4px">${p.corredor||p.g} X:${p.x}</small> R$${p.preco}</small></div></div><div><button class="b" onclick="editar(${p._i})">EDIT</button> <button class="b" style="border-color:#ff3b30;color:#ff3b30" onclick="apagar(${p._i})">X</button></div></div>`).join('');
  document.getElementById('total').innerText=produtos.length; desenhaMapa();
}
function desenhaMapa(){
  const mapa=document.getElementById('mapa'); mapa.innerHTML='<div style="position:absolute;right:0;top:0;bottom:0;width:30px;background:#00ff88;opacity:0.3;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;font-weight:bold;writing-mode:vertical-rl">ENTRADA 26</div>';
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(isGondola(x,y)){
      let d=document.createElement('div'); d.className='gondola';
      d.style.left=(x/COLS*100)+'%'; d.style.top=(y/ROWS*100)+'%'; d.style.width=(100/COLS)+'%'; d.style.height=(100/ROWS)+'%';
      if(x%2==1){ let lab=document.createElement('div'); lab.style.position='absolute'; lab.style.fontSize='7px'; lab.style.color='#fff'; lab.style.left='50%'; lab.style.top='50%'; lab.style.transform='translate(-50%,-50%)'; lab.innerText=getGByX(x); d.appendChild(lab); }
      mapa.appendChild(d);
    }
  }
  produtos.forEach(p=>{
    let d=document.createElement('div'); d.className='ponto'; d.style.left=(p.x/COLS*100)+'%'; d.style.top=(p.y/ROWS*100)+'%'; d.textContent=p.emoji; mapa.appendChild(d);
  });
}
function pegaXY(e){
  const r=document.getElementById('mapa').getBoundingClientRect();
  let x=Math.round((e.clientX-r.left)/r.width*COLS); let y=Math.round((e.clientY-r.top)/r.height*ROWS);
  if(x%2==1){ if(x<26) x++; else x--; }
  if(y<0) y=0; if(y>=ROWS) y=ROWS-1; if(x<0) x=0; if(x>=COLS) x=COLS-1;
  if(isGondola(x,y)){ if(x>0 &&!isGondola(x-1,y)) x--; else if(x<COLS-1 &&!isGondola(x+1,y)) x++; }
  let g=getGByX(x);
  document.getElementById('f_x').value=x; document.getElementById('f_y').value=y; document.getElementById('f_corredor').value=g;
  document.getElementById('gpsInfo').innerText=`AUTO: Corredor X:${x} Y:${y} = Gôndola ${g} (DIREITA 25-26 → ESQUERDA 1-2)`;
  let pp=document.getElementById('pontoPrev'); if(!pp){ pp=document.createElement('div'); pp.id='pontoPrev'; pp.className='ponto'; pp.style.fontSize='28px'; pp.style.filter='drop-shadow(0 0 8px #00ff88)'; document.getElementById('mapa').appendChild(pp); }
  pp.style.left=(x/COLS*100)+'%'; pp.style.top=(y/ROWS*100)+'%'; pp.textContent=document.getElementById('f_emoji').value||'📦';
}
function openForm(){ editIndex=-1; document.getElementById('formTitle').innerText='NOVO (25-26 DIREITA)'; ['f_nome','f_corredor','f_preco','f_emoji','f_x','f_y'].forEach(id=>document.getElementById(id).value=''); document.getElementById('formEdit').style.display='block'; }
function editar(i){ editIndex=i; const p=produtos[i]; document.getElementById('f_nome').value=p.nome; document.getElementById('f_corredor').value=p.corredor||p.g; document.getElementById('f_preco').value=p.preco; document.getElementById('f_emoji').value=p.emoji; document.getElementById('f_x').value=p.x; document.getElementById('f_y').value=p.y; document.getElementById('formEdit').style.display='block'; document.getElementById('gpsInfo').innerText=`EDITANDO: ${p.nome} [${p.g}] X:${p.x}`; }
function closeForm(){ document.getElementById('formEdit').style.display='none'; }
function salvar(){
  let cor=document.getElementById('f_corredor').value||'25-26';
  let x=parseInt(document.getElementById('f_x').value); let y=parseInt(document.getElementById('f_y').value);
  if(isNaN(x)) x=getXByG(cor); if(isNaN(y)) y=4;
  if(isGondola(x,y)){ alert('X em cima da gôndola! Clique no corredor ao lado.'); return; }
  const p={nome:document.getElementById('f_nome').value.toUpperCase(), corredor:cor, g:getGByX(x), preco:document.getElementById('f_preco').value, emoji:document.getElementById('f_emoji').value||'📦', x:x, y:y};
  if(!p.nome) return alert('Nome'); if(editIndex>=0) produtos[editIndex]=p; else produtos.push(p);
  closeForm(); exportar();
}
function apagar(i){ if(confirm('Apagar?')){ produtos.splice(i,1); exportar(); } }
function exportar(){
  try{
    produtos=produtos.map(p=>{ p.g=getGByX(p.x); p.corredor=p.g; return p; });
    localStorage.setItem(KEY,JSON.stringify(produtos));
    localStorage.setItem('produtos',JSON.stringify(produtos));
    document.getElementById('jsonOut').value=`✅ ${produtos.length} salvos - 25-26 DIREITA → 1-2 ESQUERDA - V60.8`;
    render();
  }catch(e){ alert('Erro: '+e.message); }
}
render();
