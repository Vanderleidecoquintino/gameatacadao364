
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ADM - GONDOLAS 1-26</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:12px}input,button{width:100%;margin:4px 0;height:40px;border-radius:8px;border:1px solid #facc15;padding:0 8px}button{background:#facc15;color:#000;font-weight:900}#lista{background:#000;padding:8px;margin-top:8px;font-size:11px;max-height:300px;overflow:auto}</style>
</head>
<body>
<h3>ADM T2- ATACADÃO 364 - G: 23-24</h3>
<input id="nome" placeholder="NOME PRODUTO ex: ARROZ">
<input id="emoji" placeholder="Emoji ex: 🍚" value="📦">
<input id="preco" placeholder="Preço ex: 22,90" value="">
<input id="g" placeholder="GÔNDOLA ex: 23-24" value="23-24">
<input id="x" placeholder="X (1 a 26) ex: 4" type="number">
<input id="y" placeholder="Y (1 a 17) ex: 2" type="number">
<button onclick="add()">+ SALVAR NO STORAGE</button>
<button onclick="limpar()" style="background:#333;color:#fff">LIMPAR TUDO</button>
<button onclick="exportar()" style="background:#22c55e">EXPORTAR produtos.json</button>
<div id="lista"></div>
<script>
let produtos=JSON.parse(localStorage.getItem('produtos')||'[]');
function render(){let d=document.getElementById('lista');d.innerHTML=produtos.map((p,i)=>`${i+1}. ${p.emoji} ${p.nome} [${p.g}] x:${p.x} y:${p.y} - ${p.preco} <button onclick="rem(${i})" style="height:20px;width:60px">DEL</button>`).join('<br>');}
function add(){
  let nome=document.getElementById('nome').value.toUpperCase();
  let emo=document.getElementById('emoji').value||'📦';
  let preco=document.getElementById('preco').value;
  let g=document.getElementById('g').value||'23-24'; // <--- AGORA g: 23-24
  let x=parseInt(document.getElementById('x').value);
  let y=parseInt(document.getElementById('y').value);
  if(!nome||isNaN(x)||isNaN(y)){alert('Preencha NOME, X, Y');return;}
  produtos.push({nome, emoji:emo, preco, g, x, y}); // salva g, não corredor
  localStorage.setItem('produtos',JSON.stringify(produtos));
  render(); document.getElementById('nome').value='';
}
function rem(i){produtos.splice(i,1);localStorage.setItem('produtos',JSON.stringify(produtos));render();}
function limpar(){if(confirm('Limpar?')){produtos=[];localStorage.removeItem('produtos');render();}}
function exportar(){let blob=new Blob([JSON.stringify(produtos,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='produtos.json';a.click();}
render();
</script>
</body>
</html>
