<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>ADM Loja - T1</title>
<style>
body{font-family:system-ui;padding:12px;max-width:480px;margin:auto;background:#f8f9fa}
.top{display:flex;gap:8px;position:sticky;top:0;background:#f8f9fa;padding:8px 0}
input{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%}
.card{background:#fff;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.b{padding:8px 12px;border-radius:8px;border:none;font-weight:700}
.edit{background:#e0f2fe}.del{background:#fee2e2;color:#b91c1c}
#formEdit{background:#111;color:#fff;padding:16px;border-radius:16px;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:none}
</style>
</head>
<body>
<h2>ADM T1 - <span id="total">0</span> produtos</h2>
<div class="top">
<input id="busca" placeholder="Buscar: alcool..." oninput="render()">
<button class="b" onclick="openForm()" style="background:#22c55e;color:#fff;min-width:80px">+ Novo</button>
</div>

<div id="lista"></div>

<textarea id="jsonOut" style="width:100%;height:120px;margin-top:20px"></textarea>
<button class="b" style="width:100%;background:#111;color:#fff" onclick="copiar()">COPIAR produtos.json</button>

<!-- FORM EDITAR -->
<div id="formEdit">
<h3 id="formTitle">Novo Produto</h3>
<input id="f_nome" placeholder="Nome">
<input id="f_corredor" placeholder="Corredor A2">
<input id="f_preco" placeholder="Preço 8.99">
<input id="f_foto" placeholder="foto.jpg">
<div style="display:flex;gap:8px;margin-top:10px">
<button class="b" style="flex:1;background:#fff;color:#111" onclick="closeForm()">Cancelar</button>
<button class="b" style="flex:1;background:#22c55e;color:#fff" onclick="salvar()">Salvar</button>
</div>
</div>

<script>
let produtos = JSON.parse(localStorage.getItem('produtos') || '[]');
let editIndex = -1;

function render(){
 const q = document.getElementById('busca').value.toLowerCase();
 const lista = document.getElementById('lista');
 const filtrados = produtos.map((p,i)=>({...p, _i:i})).filter(p=>p.nome.toLowerCase().includes(q));
 lista.innerHTML = filtrados.map(p=>`
  <div class="card">
    <div><b>${p.nome}</b><br><small>${p.corredor} - R$ ${p.preco}</small></div>
    <div><button class="b edit" onclick="editar(${p._i})">Editar</button> <button class="b del" onclick="apagar(${p._i})">X</button></div>
  </div>`).join('');
 document.getElementById('total').innerText = produtos.length;
 document.getElementById('jsonOut').value = JSON.stringify(produtos, null, 2);
 localStorage.setItem('produtos', JSON.stringify(produtos));
}

function openForm(){ editIndex=-1; document.getElementById('formTitle').innerText='Novo Produto'; ['f_nome','f_corredor','f_preco','f_foto'].forEach(id=>document.getElementById(id).value=''); document.getElementById('formEdit').style.display='block'; }
function editar(i){ editIndex=i; const p=produtos[i]; document.getElementById('f_nome').value=p.nome; document.getElementById('f_corredor').value=p.corredor; document.getElementById('f_preco').value=p.preco; document.getElementById('f_foto').value=p.foto; document.getElementById('formTitle').innerText='Editar Produto'; document.getElementById('formEdit').style.display='block'; }
function closeForm(){ document.getElementById('formEdit').style.display='none'; }
function salvar(){
 const p={nome:f_nome.value, corredor:f_corredor.value, preco:f_preco.value, foto:f_foto.value||'sem-foto.jpg'};
 if(!p.nome) return alert('Nome obrigatório');
 if(editIndex>=0) produtos[editIndex]=p; else produtos.push(p);
 closeForm(); render();
}
function apagar(i){ if(confirm('Apagar?')){ produtos.splice(i,1); render(); } }
function copiar(){ navigator.clipboard.writeText(JSON.stringify(produtos, null, 2)); alert('Copiado!'); }
render();
</script>
</body>
</html>
