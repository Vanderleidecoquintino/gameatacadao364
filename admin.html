<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM V61.3 ESQ - 25-26 ESQ / 1-2 DIR + RESET</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;padding:12px;max-width:480px;margin:auto;background:#000;color:#00ff88}
.top{display:flex;gap:8px;position:sticky;top:0;background:#000;padding:8px 0;z-index:5}
input{padding:12px;border:1px solid #00ff88;border-radius:10px;width:100%;margin-top:6px;background:#111;color:#00ff88}
.card{background:#0a0a0a;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;border:1px solid #222}
.b{padding:10px 12px;border-radius:8px;border:1px solid #00ff88;font-weight:700;background:#000;color:#00ff88}
#formEdit{background:#111;padding:16px;border-radius:16px;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:none;z-index:20;border:2px solid #00ff88;max-height:90vh;overflow:auto}
#mapa{width:100%;height:380px;border:2px solid #00ff88;border-radius:12px;position:relative;background:#000;margin:10px 0}
.ponto{position:absolute;transform:translate(-50%,-50%);font-size:22px}
.gondola{position:absolute;background:#1e40af;border:1px solid #00ff88;opacity:0.5}
</style>
</head>
<body>
<h2>> ADM V61.3 ESQ - <span id="total">0</span></h2>
<div style="font-size:10px;border:1px dashed #00ff88;padding:6px;border-radius:6px;margin:6px 0">✅ UNIFICADO: 25-26 ESQ (X=1) → ENTRADA 1-2 DIR (X=25) | X = gôndola+1</div>

<div class="top"><input id="busca" placeholder="BUSCAR..." oninput="render()"><button class="b" onclick="openForm()" style="background:#00ff88;color:#000">+ NOVO</button></div>

<div style="display:flex;gap:6px;margin:6px 0">
<button class="b" style="flex:1;background:#00ff88;color:#000" onclick="carregar40Demo()">📦 40 DEMO ESQ</button>
<button class="b" style="flex:1;border-color:#ff3b30;color:#ff3b30" onclick="limparDemo()">🗑️ LIMPAR</button>
</div>

<button class="b" style="width:100%;background:#ff3b30;color:#fff;border-color:#ff3b30;margin:8px 0" onclick="resetTotal()">💥 RESET TOTAL - APAGAR LOCALSTORAGE</button>

<div id="lista"></div>
<div id="gpsInfo" style="background:#00ff88;color:#000;padding:6px;font-size:10px;text-align:center;font-weight:bold;border-radius:6px">CLIQUE NO MAPA - CORREDOR LIVRE</div>
<div id="mapa" onclick="pegaXY(event)"></div>

<button class="b" style="width:100%;background:#00ff88;color:#000;margin-top:12px;height:50px" onclick="exportar()">💾 SALVAR V61.3 ESQ</button>
<div id="jsonOut" style="font-size:9px;color:#666;margin-top:6px"></div>

<div id="formEdit">
<h3 id="formTitle">EDITAR</h3>
<input id="f_nome" placeholder="NOME">
<div style="display:flex;gap:6px"><input id="f_emoji" placeholder="🍚"><input id="f_corredor" placeholder="25-26"></div>
<div style="display:flex;gap:6px"><input id="f_preco" placeholder="22.90"><input id="f_x" type="number" readonly style="background:#222"><input id="f_y" type="number" min="2" max="16"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="b" style="flex:1" onclick="closeForm()">CANCELAR</button><button class="b" style="flex:1;background:#00ff88;color:#000" onclick="salvar()">SALVAR</button></div>
</div>

<script>
const COLS=27,ROWS=19;
// UNIFICADO: 25-26 ESQ X=1 / 1-2 DIR X=25 (ENTRADA)
const MAP_G={'25-26':1,'23-24':3,'21-22':5,'19-20':7,'17-18':9,'15-16':11,'13-14':13,'11-12':15,'9-10':17,'7-8':19,'5-6':21,'3-4':23,'1-2':25};
function getXByG(g){ g=(g||'').toUpperCase().trim(); return MAP_G[g]||1; }
function getGByX(x){ let gx=x-1; let best='25-26',dist=99; for(let k in MAP_G){ let d=Math.abs(gx-MAP_G[k]); if(d<dist){dist=d;best=k;} } return best; }
function isGondola(x,y){ if(y==0||y==8||y==17||x==0||x==COLS-1) return true; if(x%2==1) return true; return false; }
function isParedeY(y){ return [0,1,8,9,17,18].includes(y); }

const KEY='atacadao364_FINAL';
let produtos=[]; try{produtos=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
let editIndex=-1;

function resetTotal(){
  if(confirm('💥 RESET TOTAL?\n\nVai apagar:\n- atacadao364_FINAL\n- produtos\n- atacadao364_v56 (lista do cliente)\n\nTem certeza?')){
    localStorage.removeItem('atacadao364_FINAL');
    localStorage.removeItem('produtos');
    localStorage.removeItem('atacadao364_v56');
    produtos=[];
    document.getElementById('jsonOut').innerText='✅ LOCALSTORAGE LIMPO!';
    render();
    alert('✅ Tudo apagado! Agora clique em 📦 40 DEMO ESQ');
  }
}

function carregar40Demo(){
  if(!confirm('Carregar 40 DEMO já no padrão ESQ correto?')) return;
  // DEMO JÁ NO PADRÃO ESQ: X = gôndola+1
  const demo=[
    {nome:"ARROZ 5KG",g:"25-26",preco:"26.90",emoji:"🍚",x:2,y:2},
    {nome:"FEIJAO 1KG",g:"25-26",preco:"8.49",emoji:"🫘",x:2,y:4},
    {nome:"ACUCAR 1KG",g:"25-26",preco:"4.29",emoji:"🍬",x:2,y:6},
    {nome:"OLEO SOJA",g:"23-24",preco:"7.99",emoji:"🫒",x:4,y:2},
    {nome:"CAFE 500G",g:"23-24",preco:"18.90",emoji:"☕",x:4,y:4},
    {nome:"LEITE CAIXA",g:"21-22",preco:"5.49",emoji:"🥛",x:6,y:2},
    {nome:"REFRI 2L",g:"21-22",preco:"8.99",emoji:"🥤",x:6,y:4},
  ];
  produtos=produtos.concat(demo);
  exportar();
}

function limparDemo(){ if(confirm('Limpar lista?')){ produtos=[]; exportar(); } }

function render(){
  const q=document.getElementById('busca').value.toLowerCase();
  const filtered=produtos.map((p,i)=>({...p,_i:i})).filter(p=>p.nome.toLowerCase().includes(q));
  document.getElementById('lista').innerHTML=filtered.map(p=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:22px">${p.emoji}</span><div><b>${p.nome}</b><br><small style="background:#00ff88;color:#000;padding:2px 6px;border-radius:4px">${p.g} X:${p.x} Y:${p.y}</small> R$${p.preco}</div></div><div><button class="b" onclick="editar(${p._i})">EDIT</button> <button class="b" style="border-color:#ff3b30;color:#ff3b30" onclick="apagar(${p._i})">X</button></div></div>`).join('');
  document.getElementById('total').innerText=produtos.length; desenhaMapa();
}

function desenhaMapa(){
  const mapa=document.getElementById('mapa'); mapa.innerHTML='';
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(isGondola(x,y)){
      let d=document.createElement('div'); d.className='gondola';
      d.style.left=(x/COLS*100)+'%'; d.style.top=(y/ROWS*100)+'%'; d.style.width=(100/COLS)+'%'; d.style.height=(100/ROWS)+'%';
      if(x%2==1){ let lab=document.createElement('div'); lab.style.cssText='position:absolute;font-size:7px;color:#fff;left:50%;top:50%;transform:translate(-50%,-50%)'; lab.innerText=getGByX(x+1); d.appendChild(lab); }
      mapa.appendChild(d);
    }
  }
  // ENTRADA 1-2 DIR
  let ent=document.createElement('div'); ent.style.cssText='position:absolute;left:'+(24/COLS*100)+'%;top:'+(15/ROWS*100)+'%;width:'+(100/COLS)+'%;height:'+(100/ROWS)+'%;background:#00ff88;display:flex;align-items:center;justify-content:center;font-size:6px;color:#000;font-weight:900'; ent.innerText='ENTRADA 1-2'; mapa.appendChild(ent);
  produtos.forEach(p=>{
    let d=document.createElement('div'); d.className='ponto'; d.style.left=(p.x/COLS*100)+'%'; d.style.top=(p.y/ROWS*100)+'%'; d.textContent=p.emoji; mapa.appendChild(d);
  });
}

function pegaXY(e){
  const r=document.getElementById('mapa').getBoundingClientRect();
  let x=Math.round((e.clientX-r.left)/r.width*COLS); let y=Math.round((e.clientY-r.top)/r.height*ROWS);
  if(x%2==1) x++; // força corredor par
  if(x<2) x=2; if(x>24) x=24;
  if(isParedeY(y)){ y+=2; if(y>16) y=14; }
  if(y<2) y=2; if(y>16) y=14;
  let g=getGByX(x);
  document.getElementById('f_x').value=x; document.getElementById('f_y').value=y; document.getElementById('f_corredor').value=g;
  document.getElementById('gpsInfo').innerText=`✅ Gôndola ${g} | Corredor X:${x} Y:${y} | 25-26 ESQ`;
}

function openForm(){ editIndex=-1; document.getElementById('formTitle').innerText='NOVO - 25-26 ESQ'; ['f_nome','f_corredor','f_preco','f_emoji','f_x','f_y'].forEach(id=>document.getElementById(id).value=''); document.getElementById('formEdit').style.display='block'; }
function editar(i){ editIndex=i; const p=produtos[i]; document.getElementById('f_nome').value=p.nome; document.getElementById('f_corredor').value=p.g; document.getElementById('f_preco').value=p.preco; document.getElementById('f_emoji').value=p.emoji; document.getElementById('f_x').value=p.x; document.getElementById('f_y').value=p.y; document.getElementById('formEdit').style.display='block'; }
function closeForm(){ document.getElementById('formEdit').style.display='none'; }

function salvar(){
  let gRaw=document.getElementById('f_corredor').value||'25-26';
  let g=getGByX(getXByG(gRaw)+1); // normaliza
  let x=getXByG(gRaw)+1; // X correto = gôndola + 1
  let y=parseInt(document.getElementById('f_y').value)||4;
  if(isParedeY(y)){ alert('Y na parede! Escolha Y=2,3,4,5,6,7,10,11,12,13,14,15,16'); return; }
  const p={nome:document.getElementById('f_nome').value.toUpperCase(), g:g, corredor:g, preco:document.getElementById('f_preco').value, emoji:document.getElementById('f_emoji').value||'📦', x:x, y:y};
  if(!p.nome) return alert('Nome obrigatório');
  if(editIndex>=0) produtos[editIndex]=p; else produtos.push(p);
  closeForm(); exportar();
}

function apagar(i){ if(confirm('Apagar?')){ produtos.splice(i,1); exportar(); } }

function exportar(){
  try{
    produtos=produtos.map(p=>{ let gx=getXByG(p.g); p.x=gx+1; p.g=getGByX(p.x); p.corredor=p.g; return p; });
    localStorage.setItem(KEY,JSON.stringify(produtos));
    localStorage.setItem('produtos',JSON.stringify(produtos));
    document.getElementById('jsonOut').innerText=`✅ ${produtos.length} salvos - 25-26 ESQ / 1-2 DIR - V61.3`;
    render();
  }catch(e){ alert(e.message); }
}
render();
</script>
</body>
</html>
