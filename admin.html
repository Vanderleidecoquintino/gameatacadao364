<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM V69 LADO - 360 PROD</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:8px;max-width:520px;margin:auto}input,select{width:100%;padding:10px;margin:3px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px}.b{padding:8px;border:1px solid #0f0;border-radius:8px;background:#000;color:#0f0;font-weight:bold}.card{background:#111;padding:6px;margin:4px 0;border-radius:8px;display:flex;justify-content:space-between;border:1px solid #222;font-size:10px}#formEdit{display:none;position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#1a1a1a;padding:12px;border:2px solid #0f0;border-radius:15px 15px 0 0;z-index:10}.ladoBtn{flex:1;height:38px;border:2px solid #0f0;background:#000;color:#0f0;font-weight:900;border-radius:8px}.ladoBtn.sel{background:#0f0;color:#000}#mapa{width:100%;height:500px;border:2px solid #0f0;position:relative;background:#000;margin:6px 0;border-radius:10px;overflow:hidden}.gondola{position:absolute;background:#1e40af;border:1px solid #00d4ff;opacity:.6;box-sizing:border-box}.ponto{position:absolute;transform:translate(-50%,-50%);font-size:14px;z-index:3}.label{position:absolute;font-size:7px;color:#fff;z-index:4;background:#000;padding:1px 3px;border:1px solid #0f0}</style></head><body>
<h3 style="text-align:center">ADM V69 LADO 25/26 - 360 PROD <span id="total">0</span></h3>
<input id="busca" placeholder="BUSCAR ex: WHEY, CHOCOLATE" oninput="render()">
<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">
<button class="b" style="flex:1;background:#0f0;color:#000" onclick="exportar()">💾 SALVAR</button>
<button class="b" style="flex:1;background:#ff0;color:#000" onclick="provocar360()">🔥 PROVOCAR 360 C/ LADO</button>
<button class="b" style="flex:1" onclick="render()">🔄 MAPA</button>
<button class="b" style="color:red" onclick="if(confirm('RESET TUDO?')){localStorage.clear();location.reload()}">RESET</button>
</div>
<div style="display:flex;gap:4px"><button class="b" style="flex:1" onclick="filtrarLado(25)">SÓ LADO 25</button><button class="b" style="flex:1" onclick="filtrarLado(26)">SÓ LADO 26</button><button class="b" style="flex:1" onclick="filtrarLado(0)">TODOS</button></div>
<div id="lista"></div><div id="mapa"></div><div id="msg" style="text-align:center;font-size:10px;padding:4px"></div>
<div id="formEdit"><h4 id="t" style="margin:4px 0"></h4>
<input id="f_nome" placeholder="NOME">
<div style="display:flex;gap:4px"><input id="f_emoji" placeholder="EMOJI" style="width:80px"><input id="f_preco" placeholder="PREÇO"><input id="f_g" placeholder="GONDOLA ex:25-26"></div>
<div style="margin:6px 0"><div style="font-size:10px;margin-bottom:4px">LADO DA GÔNDOLA (ex: 25-26):</div><div style="display:flex;gap:6px"><button id="btnL25" class="ladoBtn" onclick="setLado(1)">LADO 25<br><small>ESQ</small></button><button id="btnL26" class="ladoBtn" onclick="setLado(2)">LADO 26<br><small>DIR</small></button></div><div id="ladoInfo" style="font-size:9px;text-align:center;margin:4px 0;color:#ff0"></div></div>
<div style="display:flex;gap:4px"><input id="f_x" type="number" placeholder="X auto"><input id="f_y" type="number" placeholder="Y 16=caixa 2=fundo"></div>
<div style="display:flex;gap:4px;margin-top:6px"><button class="b" style="flex:1" onclick="document.getElementById('f_y').value=parseInt(document.getElementById('f_y').value||16)-1">⬆️ SOBE</button><button class="b" style="flex:1" onclick="document.getElementById('f_y').value=parseInt(document.getElementById('f_y').value||16)+1">⬇️ DESCE</button></div>
<div style="display:flex;gap:6px;margin-top:8px"><button class="b" style="flex:1" onclick="closeForm()">CANCELAR</button><button class="b" style="flex:1;background:#0f0;color:#000" onclick="salvar()">💾 SALVAR</button></div>
</div>
<script>
const COLS=27,ROWS=19,KEY='ADM_V615_FIX';
const MAP_G={'25-26':2,'23-24':4,'21-22':6,'19-20':8,'17-18':10,'15-16':12,'13-14':14,'11-12':16,'9-10':18,'7-8':20,'5-6':22,'3-4':24,'1-2':26};
function getGByX(x){let best='25-26',d=99;for(let k in MAP_G){let dd=Math.abs(x-MAP_G[k]);if(dd<d){d=dd;best=k;}}return best;}
function getLadoNum(g, idx){let parts=g.split('-'); if(idx==1) return parseInt(parts[0]); return parseInt(parts[1]);}
let produtos=[];try{produtos=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){produtos=[]}
let edit=-1, curLadoIdx=1, filtroLado=0;
function filtrarLado(l){filtroLado=l;render();}
function provocar360(){
 if(!confirm('Vai criar 360 produtos com LADO?\n\nWHEY no LADO 25 (esq)\nCHOCOLATE no LADO 26 (dir)\n\nSUBSTITUIR tudo?')) return;
 const gondolas=Object.keys(MAP_G);
 const nomesL25=["WHEY","CREATINA","BCAA","BARRA PROT","PASTA AMENDO","AVENA","LEITE DESNAT","IOGURTE","QUEIJO","FRANGO","OVO","ARROZ","FEIJAO"];
 const nomesL26=["CHOCOLATE","BALA FINI","REFRI","BISCOITO","SORVETE","CAFE","ACUCAR","OLEO","BOLACHA","SABONETE","DETERGENTE","PAPEL HIG","SHAMPOO"];
 let novos=[]; let id=0;
 gondolas.forEach((g)=>{
  let x=MAP_G[g];
  let ladoNum1=getLadoNum(g,1), ladoNum2=getLadoNum(g,2);
  for(let y=2;y<=16;y++){
   id++; novos.push({nome:nomesL25[id%nomesL25.length]+" "+g+" L"+ladoNum1+" POS"+(17-y), emoji:"💪", g:g, lado:ladoNum1, ladoIdx:1, preco:(Math.random()*20+5).toFixed(2), x:x, y:y});
   id++; novos.push({nome:nomesL26[id%nomesL26.length]+" "+g+" L"+ladoNum2+" POS"+(17-y), emoji:"🍫", g:g, lado:ladoNum2, ladoIdx:2, preco:(Math.random()*15+2).toFixed(2), x:x, y:y});
   if(novos.length>=360) break;
  }
 });
 novos=novos.slice(0,360);
 produtos=novos;
 exportar();
 alert('360 CRIADOS! 180 LADO 25 (esq) + 180 LADO 26 (dir)');
}
function render(){
 let q=(document.getElementById('busca').value||'').toLowerCase();
 let html='';let filtro=produtos.filter(p=>{let ok=p.nome.toLowerCase().includes(q); if(filtroLado!=0) ok=ok && p.lado==filtroLado; return ok;});
 filtro.slice(0,120).forEach(p=>{
  let idx=produtos.indexOf(p);
  let corLado=p.ladoIdx==1?'#00d4ff':'#ff0';
  html+=`<div class="card"><div> ${p.emoji} <b>${p.nome}</b><br><small style="background:${corLado};color:#000;padding:2px 4px;border-radius:4px">G[${p.g}] LADO ${p.lado} ${p.ladoIdx==1?'⬅️ ESQ':'➡️ DIR'} X:${p.x} Y:${p.y} POS:${17-p.y}</small></div><div style="display:flex;flex-direction:column;gap:2px"><button class="b" style="font-size:9px;padding:4px" onclick="editar(${idx})">EDIT</button><button class="b" style="color:red;font-size:9px;padding:4px" onclick="apagar(${idx})">X</button></div></div>`;
 });
 document.getElementById('lista').innerHTML=html||'<div style="text-align:center;padding:20px">Vazio - clique PROVOCAR 360</div>';
 document.getElementById('total').innerText=produtos.length;
 let m=document.getElementById('mapa');m.innerHTML='';
 for(let y=0;y<ROWS;y++){for(let x=0;x<COLS;x++){if(x%2==1 || y==0 || y==8 || y==9 || y==18 || x==0 || x==26){let d=document.createElement('div');d.className='gondola';d.style.left=(x/COLS*100)+'%';d.style.top=(y/ROWS*100)+'%';d.style.width=(100/COLS)+'%';d.style.height=(100/ROWS)+'%';m.appendChild(d);}}}
 for(let k in MAP_G){let x=MAP_G[k]; let d=document.createElement('div'); d.className='label'; d.style.left=(x/COLS*100)+'%'; d.style.top='2%'; d.textContent=k; m.appendChild(d);}
 produtos.slice(0,200).forEach(p=>{
  let off = p.ladoIdx==1 ? -0.35 : 0.35;
  let d=document.createElement('div');d.className='ponto';d.style.left=((p.x+off)/COLS*100)+'%';d.style.top=(p.y/ROWS*100)+'%';d.textContent=p.emoji; m.appendChild(d);
 });
}
function setLado(idx){curLadoIdx=idx; document.getElementById('btnL25').classList.toggle('sel', idx==1); document.getElementById('btnL26').classList.toggle('sel', idx==2); let g=document.getElementById('f_g').value||'25-26'; let num=getLadoNum(g,idx); document.getElementById('ladoInfo').innerText='Selecionado LADO '+num+' '+(idx==1?'⬅️ ESQ da gôndola':'➡️ DIR da gôndola');}
function editar(i){edit=i;let p=produtos[i];document.getElementById('t').innerText=p.nome;document.getElementById('f_nome').value=p.nome;document.getElementById('f_emoji').value=p.emoji;document.getElementById('f_g').value=p.g;document.getElementById('f_preco').value=p.preco;document.getElementById('f_x').value=p.x;document.getElementById('f_y').value=p.y;curLadoIdx=p.ladoIdx||1;setLado(curLadoIdx);document.getElementById('formEdit').style.display='block';}
function closeForm(){document.getElementById('formEdit').style.display='none';}
function salvar(){let g=(document.getElementById('f_g').value||'25-26').toUpperCase(); let x=MAP_G[g]||2; let ladoNum=getLadoNum(g,curLadoIdx); let p={nome:document.getElementById('f_nome').value.toUpperCase(),emoji:document.getElementById('f_emoji').value||'📦',g:g,lado:ladoNum,ladoIdx:curLadoIdx,preco:document.getElementById('f_preco').value||'9.90',x:x,y:parseInt(document.getElementById('f_y').value)||16};if(edit>=0)produtos[edit]=p;else produtos.push(p);closeForm();exportar();}
function apagar(i){if(confirm('Apagar?')){produtos.splice(i,1);exportar();}}
function exportar(){localStorage.setItem(KEY,JSON.stringify(produtos));localStorage.setItem('atacadao364_FINAL',JSON.stringify(produtos));localStorage.setItem('produtos',JSON.stringify(produtos));document.getElementById('msg').innerText='✅ '+produtos.length+' salvos | LADO 25 ESQ ⬅️ | LADO 26 DIR ➡️ | Bandeiras mantidas';render();}
render();
</script></body></html>
