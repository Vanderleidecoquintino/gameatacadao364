<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM V60 - MATRIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:system-ui;padding:14px}
h1{color:#00ff88;margin-bottom:12px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:6px 0;font-size:16px}
button{padding:12px 16px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.btn-save{background:#00ff88;color:#000;width:100%;font-size:18px;margin-top:10px}
.btn-del{background:#ff3b30;color:#fff;padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;background:#222;padding:10px;border-radius:10px;border:1px solid #333}
.item b{font-size:13px}
pre{background:#000;padding:10px;border-radius:8px;overflow:auto;font-size:11px;color:#0f0;margin-top:10px;border:1px solid #333}
</style>
</head>
<body>
<h1>🛠️ ADM V60 - ATACADÃO 364</h1>
<div style="background:#00ff8811;border:1px solid #00ff88;padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px">
✅ MATRIX ATIVA - Gôndola ajusta tudo sozinha<br>
KEY: <b>atacadao364_FINAL</b> (não apaga no reload)
</div>

<div class="card">
  <input id="nome" placeholder="NOME DO PRODUTO ex: ARROZ 5KG">
  <select id="gondola"></select>
  <input id="preco" placeholder="PREÇO ex: 22,90">
  <input id="emoji" placeholder="EMOJI ex: 🍚">
  <button class="btn-save" onclick="addProduto()">💾 SALVAR PRODUTO</button>
  <button onclick="exportarJSON()" style="width:100%;margin-top:8px;background:#222;color:#fff;border:1px solid #444">📤 Exportar produtos.json</button>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b>Lista: <span id="qtd">0</span> produtos</b>
    <button onclick="limparTudo()" style="background:#222;color:#ff3b30;border:1px solid #333">Zerar tudo</button>
  </div>
  <div id="lista" class="grid" style="margin-top:10px"></div>
  <pre id="matrixView"></pre>
</div>

<script>
// ============ MATRIX OFICIAL - EDITE SÓ AQUI SE PRECISAR ============
const MATRIX_GONDOLAS=[
  {g:'25-26',x:1},{g:'23-24',x:3},{g:'21-22',x:5},{g:'19-20',x:7},{g:'17-18',x:9},
  {g:'15-16',x:11},{g:'13-14',x:13},{g:'11-12',x:15},{g:'9-10',x:17},{g:'7-8',x:19},
  {g:'5-6',x:21},{g:'3-4',x:23},{g:'1-2',x:25}
];
const KEY='atacadao364_FINAL';
function getX(g){return (MATRIX_GONDOLAS.find(m=>m.g==g)||{x:3}).x;}
// ===================================================================

let produtos=JSON.parse(localStorage.getItem(KEY)||'[]');

const sel=document.getElementById('gondola');
MATRIX_GONDOLAS.forEach(m=>{
  let o=document.createElement('option'); o.value=m.g; o.textContent=`GÔNDOLA ${m.g} -> x:${m.x}`;
  sel.appendChild(o);
});
sel.value='23-24';

function render(){
  document.getElementById('qtd').textContent=produtos.length;
  document.getElementById('lista').innerHTML=produtos.map((p,i)=>`
    <div class="item">
      <div><b>${p.emoji||'📦'} ${p.nome}</b><br><small style="color:#00ff88">G:${p.g} x:${p.x} | R$${p.preco}</small></div>
      <button class="btn-del" onclick="del(${i})">X</button>
    </div>
  `).join('');
  document.getElementById('matrixView').textContent='MATRIX ATUAL:\n'+JSON.stringify(MATRIX_GONDOLAS,null,2);
  localStorage.setItem(KEY, JSON.stringify(produtos));
  localStorage.setItem('produtos', JSON.stringify(produtos));
}
function addProduto(){
  let nome=document.getElementById('nome').value.trim().toUpperCase();
  let g=document.getElementById('gondola').value;
  let preco=document.getElementById('preco').value.trim();
  let emoji=document.getElementById('emoji').value.trim()||'📦';
  if(!nome) return alert('Digite nome');
  produtos.push({nome, g, corredor:g, x:getX(g), y:2, preco, emoji});
  document.getElementById('nome').value=''; document.getElementById('preco').value='';
  render();
}
function del(i){ produtos.splice(i,1); render(); }
function limparTudo(){ if(confirm('Apagar TUDO?')){ produtos=[]; render(); } }
function exportarJSON(){
  let blob=new Blob([JSON.stringify(produtos,null,2)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='produtos.json'; a.click();
}
render();
</script>
</body>
</html>
