<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>ADM V60.8 ENTRADA 1-2</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:monospace;padding:12px;max-width:480px;margin:auto;background:#000;color:#00ff88}
.top{display:flex;gap:8px;position:sticky;top:0;background:#000;padding:8px 0;z-index:5;border-bottom:1px solid #00ff88}
input,textarea{padding:12px;border:1px solid #00ff88;border-radius:10px;width:100%;margin-top:6px;background:#000;color:#00ff88}
.card{background:#0a0a0a;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #222}
.b{padding:8px 12px;border-radius:8px;border:1px solid #00ff88;font-weight:700;background:#000;color:#00ff88}
#formEdit{background:#111;padding:16px;border-radius:16px;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:none;z-index:20;border:2px solid #00ff88}
#mapa{width:100%;height:380px;border:2px solid #00ff88;border-radius:12px;position:relative;background:#000;margin:10px 0;cursor:crosshair}
.ponto{position:absolute;transform:translate(-50%,-50%);font-size:22px}.gondola{position:absolute;background:#1e40af;border:1px solid #00ff88;opacity:0.5}
#gpsInfo{background:#00ff88;color:#000;padding:4px;font-size:9px;text-align:center;font-weight:bold}
</style></head><body>
<h2>> ADM V60.8 ENTRADA 1-2 → FINAL 25-26</h2>
<div style="font-size:9px;border:1px dashed #00ff88;padding:4px">ENTRADA DIREITA = 1-2 | FINAL ESQUERDA = 25-26</div>
<div class="top"><input id="busca" placeholder="BUSCAR..." oninput="render()"><button class="b" onclick="openForm()" style="background:#00ff88;color:#000">+ NOVO</button></div>
<div id="lista"></div><div id="gpsInfo">CLIQUE NO CORREDOR - AUTO GÔNDOLA 1-2→25-26</div><div id="mapa" onclick="pegaXY(event)"></div>
<button class="b" style="width:100%;background:#00ff88;color:#000;margin-top:12px" onclick="exportar()">💾 SALVAR V60.8</button>
<div id="formEdit"><h3 id="formTitle">EDITAR</h3><input id="f_nome" placeholder="NOME"><div style="display:flex;gap:6px"><input id="f_emoji" placeholder="🍚"><input id="f_corredor" placeholder="GÔNDOLA"></div><div style="display:flex;gap:6px"><input id="f_preco" placeholder="22.90"><input id="f_x" type="number"><input id="f_y" type="number"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="b" style="flex:1" onclick="closeForm()">CANCELAR</button><button class="b" style="flex:1;background:#00ff88;color:#000" onclick="salvar()">SALVAR</button></div></div>
<script>
const COLS=27,ROWS=19;
const MAP_G={'1-2':25,'3-4':23,'5-6':21,'7-8':19,'9-10':17,'11-12':15,'13-14':13,'15-16':11,'17-18':9,'19-20':7,'21-22':5,'23-24':3,'25-26':1};
function getXByG(g){return MAP_G[g]||25}
function getGByX(x){let best='1-2',dist=99;for(let k in MAP_G){let d=Math.abs(x-MAP_G[k]);if(d<dist){dist=d;best=k}}return best}
function isGondola(x,y){if(y==0||y==8||y==17||x==0||x==COLS-1) return true; if(x%2==1) return true; return false}
const KEY='atacadao364_FINAL';let produtos=[];try{produtos=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let editIndex=-1;
function render(){const q=document.getElementById('busca').value.toLowerCase();const f=produtos.map((p,i)=>({...p,_i:i})).filter(p=>p.nome.toLowerCase().includes(q));document.getElementById('lista').innerHTML=f.map(p=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:22px">${p.emoji}</span><div><b>${p.nome}</b><br><small style="background:#00ff88;color:#000;padding:2px;border-radius:4px">${p.g} X:${p.x}</small> R$${p.preco}</div></div><div><button class="b" onclick="editar(${p._i})">EDIT</button> <button class="b" style="border-color:#ff3b30;color:#ff3b30" onclick="apagar(${p._i})">X</button></div></div>`).join('');desenhaMapa()}
function desenhaMapa(){const mapa=document.getElementById('mapa');mapa.innerHTML='<div style="position:absolute;right:0;top:0;bottom:0;width:30px;background:#00ff88;opacity:0.3;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;font-weight:bold;writing-mode:vertical-rl">ENTRADA 1-2</div>';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(isGondola(x,y)){let d=document.createElement('div');d.className='gondola';d.style.left=(x/COLS*100)+'%';d.style.top=(y/ROWS*100)+'%';d.style.width=(100/COLS)+'%';d.style.height=(100/ROWS)+'%';if(x%2==1){let lab=document.createElement('div');lab.style.position='absolute';lab.style.fontSize='7px';lab.style.color='#fff';lab.style.left='50%';lab.style.top='50%';lab.style.transform='translate(-50%,-50%)';lab.innerText=getGByX(x);d.appendChild(lab)}mapa.appendChild(d)}}produtos.forEach(p=>{let d=document.createElement('div');d.className='ponto';d.style.left=(p.x/COLS*100)+'%';d.style.top=(p.y/ROWS*100)+'%';d.textContent=p.emoji;mapa.appendChild(d)})}
function pegaXY(e){const r=document.getElementById('mapa').getBoundingClientRect();let x=Math.round((e.clientX-r.left)/r.width*COLS);let y=Math.round((e.clientY-r.top)/r.height*ROWS);if(x%2==1){if(x<26)x++;else x--}if(isGondola(x,y)){if(x>0&&!isGondola(x-1,y))x--;else if(x<COLS-1&&!isGondola(x+1,y))x++}let g=getGByX(x);document.getElementById('f_x').value=x;document.getElementById('f_y').value=y;document.getElementById('f_corredor').value=g;document.getElementById('gpsInfo').innerText=`AUTO: X:${x} Y:${y} = GÔNDOLA ${g} - ENTRADA 1-2 → FINAL 25-26`;let pp=document.getElementById('pontoPrev');if(!pp){pp=document.createElement('div');pp.id='pontoPrev';pp.className='ponto';pp.style.fontSize='28px';document.getElementById('mapa').appendChild(pp)}pp.style.left=(x/COLS*100)+'%';pp.style.top=(y/ROWS*100)+'%';pp.textContent=document.getElementById('f_emoji').value||'📦'}
function openForm(){editIndex=-1;document.getElementById('formTitle').innerText='NOVO - ENTRADA 1-2';['f_nome','f_corredor','f_preco','f_emoji','f_x','f_y'].forEach(id=>document.getElementById(id).value='');document.getElementById('formEdit').style.display='block'}
function editar(i){editIndex=i;const p=produtos[i];document.getElementById('f_nome').value=p.nome;document.getElementById('f_corredor').value=p.g;document.getElementById('f_preco').value=p.preco;document.getElementById('f_emoji').value=p.emoji;document.getElementById('f_x').value=p.x;document.getElementById('f_y').value=p.y;document.getElementById('formEdit').style.display='block'}
function closeForm(){document.getElementById('formEdit').style.display='none'}
function salvar(){let cor=document.getElementById('f_corredor').value||'1-2';let x=parseInt(document.getElementById('f_x').value);let y=parseInt(document.getElementById('f_y').value);if(isNaN(x))x=getXByG(cor);if(isNaN(y))y=4;if(isGondola(x,y)){alert('Clicou na gôndola! Clique no corredor.');return}const p={nome:document.getElementById('f_nome').value.toUpperCase(),g:getGByX(x),corredor:getGByX(x),preco:document.getElementById('f_preco').value,emoji:document.getElementById('f_emoji').value||'📦',x:x,y:y};if(!p.nome)return alert('Nome');if(editIndex>=0)produtos[editIndex]=p;else produtos.push(p);closeForm();exportar()}
function apagar(i){if(confirm('Apagar?')){produtos.splice(i,1);exportar()}}
function exportar(){try{produtos=produtos.map(p=>{p.g=getGByX(p.x);p.corredor=p.g;return p});localStorage.setItem(KEY,JSON.stringify(produtos));localStorage.setItem('produtos',JSON.stringify(produtos));render()}catch(e){alert(e.message)}}render();
</script></body></html>
