<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa + Show - Com Memória</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f0f;color:#fff;padding:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0}
.tab{padding:10px 18px;border-radius:20px;background:#222;color:#888;border:1px solid #333;cursor:pointer;font-weight:800;font-size:13px}
.tab.active{background:#1DB954;color:#000}
.panel{display:none} .panel.active{display:block}
.mesa{display:flex;gap:10px;overflow-x:auto;padding:10px}
.canal{min-width:85px;background:#1a1a1a;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid #2a2a2a}
.fader{-webkit-appearance:slider-vertical;width:8px;height:100px}
button{padding:10px 16px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.play{background:#1DB954;color:#000} .stop{background:#333;color:#fff}
#queue{background:#1DB95415;border:1px solid #1DB95455;border-radius:12px;padding:12px}
#showList{max-height:55vh;overflow-y:auto;background:#151515;border-radius:12px;padding:8px;margin-top:10px}
.song{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.status{font-size:11px;color:#1DB954;text-align:center;margin:6px}
</style>
</head>
<body>
<h1 style="text-align:center;font-size:16px">🎛️ MESA + SHOW [SALVA AUTOMÁTICO]</h1>
<div class="status" id="saveStatus">💾 Salvamento automático ativo</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('mesa')">MODO MESA</div>
<div class="tab" onclick="switchTab('show')">MODO SHOW (100)</div>
</div>

<div id="panel-mesa" class="panel active">
<div style="text-align:center"><button class="play" id="playMesa">▶ PLAY</button><button class="stop" id="stopMesa">STOP</button><button class="stop" onclick="clearMesa()" style="font-size:11px">LIMPAR TUDO</button></div>
<input type="file" id="fileMesa" multiple accept="audio/*" style="margin:10px 0;width:100%;background:#222;padding:10px;border-radius:8px">
<div id="mesa" class="mesa"></div>
</div>

<div id="panel-show" class="panel">
<div id="queue"><b>FILA: <span id="queueCount">0</span></b><div id="queueList" style="font-size:11px;color:#aaa;margin-top:4px">Vazia</div><button class="play" id="playShow">▶ TOCAR FILA</button><button class="stop" id="nextShow">⏭ NEXT</button></div>
<input id="search" placeholder="🔍 Buscar..." style="width:100%;padding:12px;background:#222;border:1px solid #333;color:#fff;border-radius:10px;margin:10px 0">
<input type="file" id="fileShow" multiple accept="audio/*" style="width:100%;background:#222;padding:10px;border-radius:8px">
<div id="showList"></div>
<button class="stop" onclick="clearShow()" style="width:100%;margin-top:10px;font-size:11px">🗑️ LIMPAR BANCO DE MÚSICAS</button>
</div>

<script>
let ctx,master;
function getCtx(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination);} if(ctx.state==='suspended')ctx.resume(); return ctx;}
function switchTab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));document.getElementById('panel-'+t).classList.add('active');event.target.classList.add('active'); localStorage.setItem('lastTab',t);}
const lastTab=localStorage.getItem('lastTab'); if(lastTab) setTimeout(()=>{document.querySelector(`[onclick="switchTab('${lastTab}')"]`)?.click()},100);

// MESA COM LOCALSTORAGE
let mesaBufs={},mesaNodes={};const CANAIS=['vocals','drums','bass','guitar','piano','other'];
(function(){const m=document.getElementById('mesa');CANAIS.forEach(id=>{const d=document.createElement('div');d.className='canal';d.innerHTML=`<b style="font-size:10px">${id}</b><input type="range" min="0" max="1.5" step="0.01" value="${localStorage.getItem('vol_'+id)||1}" class="fader" data-id="${id}">`;m.appendChild(d);});document.querySelectorAll('#mesa .fader').forEach(f=>{f.oninput=e=>{const id=e.target.dataset.id; const v=parseFloat(e.target.value); localStorage.setItem('vol_'+id,v); if(mesaNodes[id])mesaNodes[id].gain.gain.value=v; document.getElementById('saveStatus').innerText='💾 Volume salvo!'; setTimeout(()=>document.getElementById('saveStatus').innerText='💾 Salvamento automático ativo',1000)}});})();
document.getElementById('fileMesa').onchange=async e=>{getCtx();for(let file of e.target.files){let k=CANAIS.find(c=>file.name.toLowerCase().includes(c))||file.name; const ab=await file.arrayBuffer(); mesaBufs[k]=await ctx.decodeAudioData(ab);} localStorage.setItem('mesa_ok','1'); alert('Mesa carregada e salva!');};
document.getElementById('playMesa').onclick=()=>{getCtx();Object.values(mesaNodes).forEach(n=>{try{n.src.stop()}catch{}});mesaNodes={};for(let id in mesaBufs){const src=ctx.createBufferSource();src.buffer=mesaBufs[id];const g=ctx.createGain();g.gain.value=parseFloat(localStorage.getItem('vol_'+id)||1);src.connect(g);g.connect(master);src.start();mesaNodes[id]={src,gain:g};}};
document.getElementById('stopMesa').onclick=()=>{Object.values(mesaNodes).forEach(n=>{try{n.src.stop()}catch{}});};
window.clearMesa=()=>{localStorage.clear(); location.reload();}

// SHOW COM INDEXEDDB
let allSongs=[],queue=[],currentShow=null;
const DB_NAME='ShowDB100'; const STORE='songs';
function openDB(){return new Promise(res=>{const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); r.onsuccess=e=>res(e.target.result);});}
async function loadFromDB(){const db=await openDB(); const tx=db.transaction(STORE,'readonly'); const req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>{allSongs=req.result.map(o=>({name:o.name,file:new File([o.blob],o.name)})); renderShow(); const q=JSON.parse(localStorage.getItem('queue_names')||'[]'); queue=allSongs.filter(s=>q.includes(s.name)); updateQueue(); if(allSongs.length) document.getElementById('saveStatus').innerText=`💾 ${allSongs.length} músicas restauradas!`;}}
async function saveToDB(file){const db=await openDB(); const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).add({name:file.name,blob:file});}
function renderShow(filter=''){const list=document.getElementById('showList');list.innerHTML='';allSongs.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase())).forEach(s=>{const d=document.createElement('div');d.className='song';d.innerHTML=`<b style="font-size:12px">${s.name}</b><button onclick="addQueueByName('${s.name.replace(/'/g,"\\'")}')" style="background:#2a2a2a;color:#fff;padding:6px 10px;font-size:11px;border-radius:6px">+ FILA</button>`;list.appendChild(d);});}
window.addQueueByName=name=>{const f=allSongs.find(s=>s.name===name); if(f){queue.push(f); saveQueue(); updateQueue();}};
function saveQueue(){localStorage.setItem('queue_names',JSON.stringify(queue.map(s=>s.name)));}
function updateQueue(){document.getElementById('queueCount').innerText=queue.length;document.getElementById('queueList').innerText=queue.map((s,i)=> (i+1)+'. '+s.name).join(' | ')||'Vazia';}
document.getElementById('fileShow').onchange=async e=>{for(let f of e.target.files){await saveToDB(f); allSongs.push({name:f.name,file:f});} renderShow(); saveQueue();};
document.getElementById('search').oninput=e=>renderShow(e.target.value);
document.getElementById('playShow').onclick=()=>{if(!queue.length)return alert('Fila vazia'); getCtx(); playNext();};
async function playNext(){if(!queue.length)return; const song=queue.shift(); saveQueue(); updateQueue(); const ab=await song.file.arrayBuffer(); const buf=await ctx.decodeAudioData(ab); if(currentShow) try{currentShow.stop()}catch{} const src=ctx.createBufferSource();src.buffer=buf;src.connect(master);src.start();currentShow=src;document.getElementById('queueList').innerText='▶ Tocando: '+song.name; src.onended=()=>{if(queue.length)playNext();};}
document.getElementById('nextShow').onclick=()=>playNext();
window.clearShow=async()=>{const db=await openDB(); db.transaction(STORE,'readwrite').objectStore(STORE).clear(); localStorage.removeItem('queue_names'); allSongs=[]; queue=[]; renderShow(); updateQueue(); alert('Banco limpo');}
loadFromDB();
</script>
</body>
</html>
