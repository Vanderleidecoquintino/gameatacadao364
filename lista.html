<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BACKEND BIPADOR</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;padding:10px;background:#f2f2f2}
h1{text-align:center}
#busca{width:100%;height:50px;border:3px solid #000;border-radius:12px;padding:0 15px;font-size:18px;font-weight:700;background:#ffff00;position:sticky;top:10px;z-index:5}
.btn{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.btn-add{background:#000;color:#ffff00}
.btn-scan{background:#25D366;color:#000}
.btn-exp{background:#fff;border:2px solid #000}
.card{background:#fff;border:2px solid #000;border-radius:12px;padding:12px;margin:10px 0;text-align:center;position:relative}
.nome{font-weight:900;font-size:16px;text-transform:uppercase}
.cod{font-weight:700;margin:5px 0}
.acoes{display:flex;gap:8px;margin-top:10px}
.acoes button{flex:1;padding:10px;border-radius:8px;border:2px solid #000;font-weight:800}
.edit{background:#ffff00}
.del{background:#ff4444;color:#fff}
svg{width:100%!important;height:90px!important}
#reader{width:100%;border-radius:12px;overflow:hidden;display:none;margin:10px 0}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px}
.modal-box input{width:100%;padding:14px;margin:8px 0;border:2px solid #000;border-radius:10px;font-size:16px;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<h1>📦 BACKEND BIPADOR</h1>
<input id="busca" placeholder="🔍 BUSCAR..." oninput="render()">
<button class="btn btn-scan" onclick="iniciarScanner()">📷 BIPAR COM CÂMERA</button>
<div id="reader"></div>
<button class="btn btn-add" onclick="abrirModal()">➕ ADD NOVO PRODUTO</button>
<div id="lista"></div>
<button class="btn btn-exp" onclick="exportar()">💾 EXPORTAR BACKUP JSON</button>
<input type="file" id="importFile" style="display:none" onchange="importar(this)">

<div class="modal" id="modal">
<div class="modal-box">
<h3 id="modalTitle">Novo Produto</h3>
<input id="mNome" placeholder="NOME DO PRODUTO (ex: CEBOLA)">
<input id="mCod" placeholder="CÓDIGO (ex: 14692998)">
<input id="mEmoji" placeholder="EMOJI (ex: 🧅)">
<input type="hidden" id="mIndex">
<button class="btn btn-add" onclick="salvar()">💾 SALVAR</button>
<button class="btn btn-exp" onclick="fecharModal()">CANCELAR</button>
</div>
</div>

<script>
let PRODUTOS = JSON.parse(localStorage.getItem('produtos_bip')) || [
{n:"MAÇA DIVERTIDA BOA ROCA",c:"000173",e:"🧙‍♀️"},
{n:"CARA PAULISTA",c:"1917949",e:"🍠"},
{n:"JILO",c:"1499938",e:"🫛"},
{n:"CEBOLA ROXA",c:"36041605",e:"🧅"},
{n:"MANDIOCA AIPIM",c:"1506929",e:"🥔"},
{n:"CEBOLA ATACADAO",c:"14692998",e:"🧅"},
{n:"MANDIOQUINHA",c:"1504910",e:"🥔"},
{n:"CEBOLA PALITO",c:"262216",e:"🧄"},
{n:"MAXIXE",c:"4779949",e:"🥒"},
{n:"CENOURA",c:"19020905",e:"🥕"},
{n:"PEPINO COMUM",c:"1514008",e:"🥒"},
{n:"CHUCHU",c:"19020990",e:"🥑"},
{n:"PEPINO JAPONES",c:"1516925",e:"🥒"},
{n:"GENGIBRE",c:"1497919",e:"🫚"},
{n:"PEPINO CAIPIRA",c:"1525",e:"🥒"},
{n:"INHAME DA COSTA",c:"19029962",e:"🍠"},
{n:"PIMENTA CAMBUCI",c:"9147999",e:"🌶️"},
{n:"ABOBORA ITALIANA",c:"1688",e:"🥒"},
{n:"ABOBORA JAP/CABOTIA",c:"1894905",e:"🎃"},
{n:"ABOBORA PTA JACAR.",c:"2093926",e:"🎃"},
{n:"ABOBORA SECA",c:"1893",e:"🎃"},
{n:"ABOBORA BRASILEIRA",c:"1892",e:"🎃"},
{n:"ABOBORA BATA",c:"64782905",e:"🎃"},
{n:"ABOBORA MORANGA",c:"1896924",e:"🎃"},
{n:"ALHO KG A GRANEL",c:"21933966",e:"🧄"},
{n:"BATATA LAVADA",c:"14691938",e:"🥔"},
{n:"BATATA ASTERIX",c:"3023977",e:"🥔"},
{n:"BATATA BOLINHA",c:"14863922",e:"🥔"},
{n:"BATATA DOCE",c:"1908912",e:"🍠"},
{n:"BETERRABA",c:"1616916",e:"🥗"},
{n:"BERINJELA COMUM",c:"1900931",e:"🍆"}
];

function salvarStorage(){ localStorage.setItem('produtos_bip', JSON.stringify(PRODUTOS)); }
function abrirModal(i=null){
 document.getElementById('modal').style.display='flex';
 if(i!==null){
  document.getElementById('modalTitle').innerText='EDITAR PRODUTO';
  document.getElementById('mNome').value=PRODUTOS[i].n;
  document.getElementById('mCod').value=PRODUTOS[i].c;
  document.getElementById('mEmoji').value=PRODUTOS[i].e;
  document.getElementById('mIndex').value=i;
 } else {
  document.getElementById('modalTitle').innerText='NOVO PRODUTO';
  document.getElementById('mNome').value='';document.getElementById('mCod').value='';document.getElementById('mEmoji').value='🥦';document.getElementById('mIndex').value='';
 }
}
function fecharModal(){ document.getElementById('modal').style.display='none'; }
function salvar(){
 let n=document.getElementById('mNome').value.toUpperCase().trim();
 let c=document.getElementById('mCod').value.trim();
 let e=document.getElementById('mEmoji').value||'🥦';
 let idx=document.getElementById('mIndex').value;
 if(!n||!c) return alert('Preencha nome e código');
 if(idx==='') PRODUTOS.push({n,c,e});
 else PRODUTOS[idx]={n,c,e};
 salvarStorage(); fecharModal(); render();
}
function excluir(i){ if(confirm('Apagar '+PRODUTOS[i].n+'?')){ PRODUTOS.splice(i,1); salvarStorage(); render(); } }
function render(){
 let q=document.getElementById('busca').value.toUpperCase();
 let div=document.getElementById('lista'); div.innerHTML='';
 let filtrados = PRODUTOS.map((p,origIdx)=>({...p,origIdx})).filter(p=>!q || p.n.includes(q) || p.c.includes(q));
 filtrados.sort((a,b)=>a.n.localeCompare(b.n));
 filtrados.forEach((p,i)=>{
  div.innerHTML+=`<div class="card"><div class="nome">${p.e} ${p.n}</div><svg id="bc${i}"></svg><div class="cod">${p.c}</div><div class="acoes"><button class="edit" onclick="abrirModal(${p.origIdx})">✏️ EDITAR</button><button class="del" onclick="excluir(${p.origIdx})">🗑️</button></div></div>`;
 });
 filtrados.forEach((p,i)=>{ try{ JsBarcode(`#bc${i}`, p.c, {format:"CODE128",width:2,height:70,displayValue:false,margin:10}); }catch(e){} });
}
let html5QrcodeScanner;
function iniciarScanner(){
 document.getElementById('reader').style.display='block';
 html5QrcodeScanner = new Html5Qrcode("reader");
 html5QrcodeScanner.start({facingMode:"environment"},{fps:10,qrbox:250},
  (decoded)=>{
   document.getElementById('busca').value=decoded;
   html5QrcodeScanner.stop(); document.getElementById('reader').style.display='none';
   render();
   let achou = PRODUTOS.find(p=>p.c===decoded);
   if(achou) alert('✅ ACHOU: '+achou.n);
   else if(confirm('Código '+decoded+' não encontrado. Adicionar novo?')){ abrirModal(); document.getElementById('mCod').value=decoded; }
  },()=>{}).catch(err=>alert('Erro câmera: '+err));
}
function exportar(){
 let blob=new Blob([JSON.stringify(PRODUTOS,null,2)],{type:'application/json'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup_bipador.json'; a.click();
}
render();
</script>
</body>
</html>
