<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LISTA BIPADORA - CORRIGIDA DA FOLHA</title>
<style>
body{background:#fff;color:#000;font-family:Arial;margin:0;padding:10px}
#busca{width:100%;height:50px;border:3px solid #000;border-radius:12px;padding:0 15px;font-size:18px;font-weight:700;box-sizing:border-box;position:sticky;top:10px;z-index:10;background:#ffff00}
.card{background:#fff;border:2px solid #000;border-radius:12px;padding:15px;margin:12px 0;text-align:center}
.nome{font-weight:900;font-size:18px;text-transform:uppercase;margin-bottom:10px}
.cod{font-size:14px;color:#000;font-weight:bold;margin-top:8px}
svg{width:100%!important;height:110px!important;background:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<input id="busca" type="text" placeholder="🔍 BUSCAR..." oninput="filtrar()" autofocus>
<div id="lista"></div>
<script>
const PRODUTOS = [
{n:"CARA PAULISTA",c:"1917949",e:"🍠"},
{n:"JILO",c:"1499936",e:"🫛"}, // CORRIGIDO - era 1489936
{n:"CEBOLA ROXA",c:"36041305",e:"🧅"}, // CORRIGIDO - era 36041905
{n:"MANDIOCA AIPIM",c:"1509829",e:"🥔"}, // CORRIGIDO - era 1506929
{n:"CEBOLA ATACADAO",c:"14982998",e:"🧅"}, // CORRIGIDO - era 14882998
{n:"MANDIOQUINHA",c:"1504910",e:"🥔"},
{n:"CEBOLA PALITO",c:"262216",e:"🧄"}, // CORRIGIDO - era 25216
{n:"MAXIXE",c:"4779949",e:"🥒"},
{n:"CENOURA",c:"19020905",e:"🥕"}, // CORRIGIDO - era 1925905
{n:"PEPINO COMUM",c:"1514008",e:"🥒"}, // CORRIGIDO - era 1514206
{n:"CHUCHU",c:"19020990",e:"🥑"}, // CORRIGIDO - era 1923990
{n:"PEPINO JAPONES",c:"1516925",e:"🥒"},
{n:"GENGIBRE",c:"1497919",e:"🫚"},
{n:"PEPINO CAIPIRA",c:"1525",e:"🥒"},
{n:"INHAME DA COSTA",c:"19029962",e:"🍠"}, // CORRIGIDO - era 1502992
{n:"PIMENTA CAMBUCI",c:"9147999",e:"🌶️"}, // CORRIGIDO - era 9147939
{n:"MAGA DIVERTIDA BOA ROCA",c:"000173",e:"🧙‍♀️"}
];
function filtrar(){
  let q=document.getElementById('busca').value.toUpperCase();
  let div=document.getElementById('lista'); div.innerHTML='';
  let filtrados = PRODUTOS.filter(p=>!q || p.n.includes(q));
  filtrados.forEach((p,i)=>{
    div.innerHTML+=`<div class="card"><div class="nome">${p.e} ${p.n}</div><svg id="bc${i}"></svg><div class="cod">${p.c}</div></div>`;
  });
  filtrados.forEach((p,i)=>{
    JsBarcode(`#bc${i}`, p.c, {
      format:"CODE128",
      width:3,
      height:100,
      displayValue:false,
      margin:15,
      background:"#ffffff",
      lineColor:"#000000"
    });
  });
}
filtrar();
</script>
</body>
</html>
