<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LISTA BIPADORA</title>
<style>
body{background:#fff;color:#000;font-family:Arial;margin:0;padding:10px}
#busca{width:100%;height:50px;border:3px solid #000;border-radius:12px;padding:0 15px;font-size:18px;font-weight:700;box-sizing:border-box;position:sticky;top:10px;z-index:10;background:#ffff00}
.card{background:#fff;border:2px solid #000;border-radius:12px;padding:10px;margin:10px 0;text-align:center;page-break-inside:avoid}
.nome{font-weight:900;font-size:18px;text-transform:uppercase;margin:5px 0}
.cod{font-size:12px;color:#666}
canvas,svg{width:100%!important;max-height:120px}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<input id="busca" type="text" placeholder="🔍 BUSCAR: cebola, arroz, pepino..." oninput="filtrar()" autofocus>
<div id="lista"></div>

<script>
const PRODUTOS = [
{n:"CARA PAULISTA",c:"1917949",e:"🍠"},
{n:"JILO",c:"1489936",e:"🫛"},
{n:"CEBOLA ROXA",c:"36041905",e:"🧅"},
{n:"MANDIOCA AIPIM",c:"1506929",e:"🥔"},
{n:"CEBOLA ATACADAO",c:"14882998",e:"🧅"},
{n:"MANDIOQUINHA",c:"1504910",e:"🥔"},
{n:"CEBOLA PALITO",c:"25216",e:"🧄"},
{n:"MAXIXE",c:"4779949",e:"🥒"},
{n:"CENOURA",c:"1925905",e:"🥕"},
{n:"PEPINO COMUM",c:"1514206",e:"🥒"},
{n:"CHUCHU",c:"1923990",e:"🥑"},
{n:"PEPINO JAPONES",c:"1516925",e:"🥒"},
{n:"GENGIBRE",c:"1497919",e:"🫚"},
{n:"PEPINO CAIPIRA",c:"1525",e:"🥒"},
{n:"INHAME DA COSTA",c:"1502992",e:"🍠"},
{n:"PIMENTA CAMBUCI",c:"9147939",e:"🌶️"},
{n:"ARROZ TIPO 1 5KG",c:"7891234567890",e:"🍚"},
{n:"FEIJAO CARIOCA 1KG",c:"7891234567891",e:"🫘"}
];

function filtrar(){
  let q=document.getElementById('busca').value.toUpperCase();
  let div=document.getElementById('lista'); div.innerHTML='';
  PRODUTOS.filter(p=>!q || p.n.includes(q)).forEach((p,i)=>{
    div.innerHTML+=`
      <div class="card">
        <div class="nome">${p.e} ${p.n}</div>
        <svg id="bc${i}"></svg>
        <div class="cod">${p.c}</div>
      </div>`;
  });
  PRODUTOS.filter(p=>!q || p.n.includes(q)).forEach((p,i)=>{
    try{
      JsBarcode(`#bc${i}`, p.c, {format:"CODE128", width:2, height:80, displayValue:true, fontSize:16, margin:5});
    }catch(e){ JsBarcode(`#bc${i}`, p.c, {format:"EAN13", width:2, height:80}); }
  });
}

filtrar();
</script>
</body>
</html>
