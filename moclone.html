<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moises V6.1 FREE FIX</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white"><div class="max-w-[480px] mx-auto p-3">
<h1 class="bg-[#00ff88] text-black font-black p-3 rounded-xl text-center">MOISES V6.1 FREE FIX</h1>
<input type="file" id="f" accept="audio/*" hidden>
<button onclick="document.getElementById('f').click()" class="mt-4 w-full border-2 border-dashed border-[#00ff88] p-6 rounded-xl font-black">📁 MANDAR MÚSICA</button>
<button id="btn" class="hidden mt-3 w-full bg-white text-black font-black h-14 rounded-xl">☁️ SEPARAR EM 6 GRÁTIS</button>
<p id="st" class="text-[11px] text-zinc-400 mt-3 text-center bg-zinc-900 p-2 rounded-xl"></p>
<div id="out" class="mt-4 space-y-2"></div>
</div>
<script>
let audioFile=null;
const $=id=>document.getElementById(id);
$('f').onchange=e=>{audioFile=e.target.files[0]; $('st').innerText='Pronto: '+audioFile.name; $('btn').classList.remove('hidden');};
const SPACE="https://amazingaudio-denoiser.hf.space";
const SPACE2="https://ahmed0913-demucs.hf.space";

$('btn').onclick=async()=>{
 if(!audioFile)return;
 $('btn').innerText='⏳ SUBINDO...'; $('st').innerText='1/4 Subindo pro servidor grátis (pode demorar 1min)...';
 try{
  // 1 - sobe o arquivo pro HF
  let uploadId=Math.random().toString(36).substring(2);
  let fd=new FormData(); fd.append('files',audioFile);
  let upRes=await fetch(SPACE2+'/upload?upload_id='+uploadId,{method:'POST',body:fd});
  if(!upRes.ok){ // tenta espaço reserva
    upRes=await fetch('https://jsn5-demucs.hf.space/upload?upload_id='+uploadId,{method:'POST',body:fd});
  }
  let upJson=await upRes.json();
  let filePath=upJson[0];
  $('st').innerText='2/4 Arquivo no servidor, separando... (2 min, não feche)';
  $('btn').innerText='⏳ SEPARANDO - NÃO FECHE';

  // 2 - chama predict
  let session=Math.random().toString(36).substring(2);
  let payload={
    data:[
      {"path":filePath,"url":SPACE2+"/file="+filePath,"meta":{"_type":"gradio.FileData"}},
      "htdemucs_6s"
    ],
    fn_index:0,
    session_hash:session
  };
  let predRes=await fetch(SPACE2+'/run/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let predJson=await predRes.json();

  // 3 - pega fila
  let tries=0;
  while(tries<60){
    let q=await fetch(SPACE2+'/queue/data?session_hash='+session);
    let text=await q.text();
    // procura por data:
    if(text.includes('"data"')){
      let lines=text.split('\n');
      for(let l of lines){
        if(l.startsWith('data: ')){
          try{
            let j=JSON.parse(l.slice(6));
            if(j.msg==='process_completed'){
              let out=j.output.data;
              $('out').innerHTML=out.map((u,i)=>u&&u.url?`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between"><span class="text-[11px] font-bold">STEM ${i+1}</span><a href="${u.url}" target="_blank" class="bg-[#00ff88] text-black text-[10px] px-4 py-2 rounded-lg font-black">BAIXAR</a></div>`:'').join('');
              $('btn').innerText='✅ PRONTO!'; $('st').innerText='Baixe as 6 abaixo';
              return;
            }
          }catch(e){}
        }
      }
    }
    await new Promise(r=>setTimeout(r,3000));
    $('st').innerText='Separando... '+tries*3+'s - não feche';
    tries++;
  }
  throw 'Timeout - servidor grátis lotado, tenta de novo';
 }catch(e){
  alert('Erro: '+e+'\nTenta de novo em 1 min, servidor grátis lota');
  $('btn').innerText='TENTAR DE NOVO'; $('st').innerText='Erro: '+e;
 }
};
</script></body></html>
