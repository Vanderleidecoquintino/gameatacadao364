<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moises V5 Final</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white"><div class="max-w-[480px] mx-auto p-3">
<h1 class="bg-[#00ff88] text-black font-black p-3 rounded-xl text-center">MOISES V5 - SEM UPLOAD<br><span class="text-[10px]">vanderleidecoquintino.github.io</span></h1>
<input id="token" type="password" placeholder=" Cole seu token r8_ aqui" class="w-full mt-3 bg-zinc-900 border border-zinc-700 p-3 rounded-xl text-[11px]">
<button onclick="localStorage.setItem('rep_token',document.getElementById('token').value);alert('Token salvo!')" class="w-full mt-2 bg-zinc-800 h-10 rounded-xl text-[10px]">💾 SALVAR TOKEN NO CEL</button>
<input type="file" id="f" accept="audio/*" hidden>
<button onclick="document.getElementById('f').click()" class="mt-4 w-full border-2 border-dashed border-[#00ff88] p-6 rounded-xl font-black">📁 MANDAR MÚSICA PRONTA</button>
<button id="btn" class="hidden mt-3 w-full bg-white text-black font-black h-14 rounded-xl">☁️ SEPARAR EM 6</button>
<p id="st" class="text-[10px] text-zinc-400 mt-2 text-center"></p><div id="out" class="mt-4 space-y-2"></div>
</div>
<script>
let audioData=''; const $=id=>document.getElementById(id);
$('f').onchange=e=>{let file=e.target.files[0]; $('st').innerText='Lendo: '+file.name;
 let r=new FileReader(); r.onload=()=>{audioData=r.result; $('st').innerText='Pronto: '+file.name+' ('+Math.round(audioData.length/1000)+'kb)'; $('btn').classList.remove('hidden');}; r.readAsDataURL(file); }
$('token').value=localStorage.getItem('rep_token')||'';
$('btn').onclick=async()=>{
 const TOKEN=localStorage.getItem('rep_token')||$('token').value;
 if(!TOKEN.startsWith('r8_')){alert('Cole token r8_ e salva');return;}
 $('btn').innerText='⏳ ENVIANDO PRA IA...';
 try{
 let res=await fetch('https://api.replicate.com/v1/models/cjwbw/demucs/predictions',{method:'POST',headers:{'Authorization':'Token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({input:{audio:audioData}})});
 let pred=await res.json(); if(pred.detail) throw pred.detail;
 while(pred.status!=='succeeded' && pred.status!=='failed'){await new Promise(r=>setTimeout(r,3000));let r2=await fetch('https://api.replicate.com/v1/predictions/'+pred.id,{headers:{'Authorization':'Token '+TOKEN}}); pred=await r2.json(); $('st').innerText='Status: '+pred.status;}
 if(pred.status==='succeeded'){ $('out').innerHTML=Object.entries(pred.output).map(([k,v])=>`<div class="bg-zinc-900 p-2 rounded-xl flex justify-between items-center"><span class="text-[10px] uppercase">${k}</span><a href="${v}" target="_blank" class="bg-[#00ff88] text-black text-[9px] px-3 py-2 rounded-lg font-black">BAIXAR</a></div>`).join(''); $('btn').innerText='✅ 6 STEMS PRONTOS!'; $('st').innerText='Feito!';}
 else throw JSON.stringify(pred);
 }catch(e){alert('Erro: '+e); $('btn').innerText='TENTAR DE NOVO'; $('st').innerText='Erro: '+e;}
}
</script></body></html>
