<script>
let audioData=''; const $=id=>document.getElementById(id);
$('f').onchange=e=>{let file=e.target.files[0]; $('st').innerText='Lendo: '+file.name;
 let r=new FileReader(); r.onload=()=>{audioData=r.result; $('st').innerText='Pronto: '+file.name+' ('+Math.round(audioData.length/1000)+'kb)'; $('btn').classList.remove('hidden');}; r.readAsDataURL(file); }
$('token').value=localStorage.getItem('rep_token')||'';
$('btn').onclick=async()=>{
 const TOKEN=localStorage.getItem('rep_token')||$('token').value;
 if(!TOKEN.startsWith('r8_')){alert('Cole token r8_ e salva');return;}
 $('btn').innerText='⏳ ENVIANDO PRA IA...';
 try{
 // FIX CORS: usa proxy
 const PROXY = 'https://corsproxy.io/?';
 let res=await fetch(PROXY + encodeURIComponent('https://api.replicate.com/v1/models/cjwbw/demucs/predictions'),{method:'POST',headers:{'Authorization':'Token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({input:{audio:audioData}})});
 let pred=await res.json(); if(pred.detail) throw pred.detail;
 while(pred.status!=='succeeded' && pred.status!=='failed'){await new Promise(r=>setTimeout(r,3000));let r2=await fetch(PROXY + encodeURIComponent('https://api.replicate.com/v1/predictions/'+pred.id),{headers:{'Authorization':'Token '+TOKEN}}); pred=await r2.json(); $('st').innerText='Status: '+pred.status;}
 if(pred.status==='succeeded'){ $('out').innerHTML=Object.entries(pred.output).map(([k,v])=>`<div class="bg-zinc-900 p-2 rounded-xl flex justify-between items-center"><span class="text-[10px] uppercase">${k}</span><a href="${v}" target="_blank" class="bg-[#00ff88] text-black text-[9px] px-3 py-2 rounded-lg font-black">BAIXAR</a></div>`).join(''); $('btn').innerText='✅ 6 STEMS PRONTOS!'; $('st').innerText='Feito!';}
 else throw JSON.stringify(pred);
 }catch(e){alert('Erro: '+e); $('btn').innerText='TENTAR DE NOVO'; $('st').innerText='Erro: '+e;}
}
</script>
