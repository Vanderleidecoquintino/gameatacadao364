<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moises V6 FREE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white"><div class="max-w-[480px] mx-auto p-3">
<h1 class="bg-[#00ff88] text-black font-black p-3 rounded-xl text-center">MOISES V6 FREE<br><span class="text-[10px]">GRÁTIS - SEM TOKEN - vanderleidecoquintino.github.io</span></h1>
<div class="bg-yellow-400 text-black p-2 rounded-xl text-[10px] mt-3 font-bold text-center">✅ ESTA VERSÃO É GRÁTIS - Não precisa de Replicate</div>
<input type="file" id="f" accept="audio/*" hidden>
<button onclick="document.getElementById('f').click()" class="mt-4 w-full border-2 border-dashed border-[#00ff88] p-6 rounded-xl font-black">📁 MANDAR MÚSICA PRONTA</button>
<button id="btn" class="hidden mt-3 w-full bg-white text-black font-black h-14 rounded-xl">☁️ SEPARAR EM 6 (GRÁTIS)</button>
<p id="st" class="text-[11px] text-zinc-400 mt-3 text-center break-all bg-zinc-900 p-2 rounded-xl"></p>
<div id="out" class="mt-4 space-y-2"></div>
<div id="player" class="mt-4"></div>
</div>
<script type="module">
let audioFile=null;
const $=id=>document.getElementById(id);
$('f').onchange=e=>{
 audioFile=e.target.files[0];
 $('st').innerText='Pronto: '+audioFile.name+' ('+Math.round(audioFile.size/1000)+'kb) - Clique em SEPARAR';
 $('btn').classList.remove('hidden');
};
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.10.0/dist/index.js";
$('btn').onclick=async()=>{
 if(!audioFile){alert('Manda a música primeiro');return;}
 $('btn').innerText='⏳ CONECTANDO NO SERVIDOR GRÁTIS...';
 $('st').innerText='0% - Isso pode levar 2 minutos, não feche';
 try{
  const app = await Client.connect("ahmed0913-demucs");
  $('st').innerText='25% - Servidor conectado, enviando música...';
  $('btn').innerText='⏳ ENVIANDO...';
  // Faz o predict - o gradio sobe o arquivo sozinho
  const result = await app.predict("/predict", [audioFile, "htdemucs_6s"]);
  $('st').innerText='75% - Separando os 6 canais...';
  console.log(result);
  let data = result.data;
  // O retorno vem como lista de arquivos
  $('out').innerHTML='';
  let labels=["DRUMS","BASS","OTHER","VOCALS","GUITAR","PIANO"];
  data.forEach((item,i)=>{
    if(item && item.url){
      let name=labels[i]||('STEM '+(i+1));
      $('out').innerHTML+=`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between items-center"><span class="text-[11px] font-bold">${name}</span><a href="${item.url}" target="_blank" download class="bg-[#00ff88] text-black text-[10px] px-4 py-2 rounded-lg font-black">BAIXAR</a></div>`;
    } else if(typeof item === 'string' && item.startsWith('http')){
      $('out').innerHTML+=`<div class="bg-zinc-900 p-3 rounded-xl flex justify-between items-center"><span class="text-[11px] font-bold">STEM ${i+1}</span><a href="${item}" target="_blank" class="bg-[#00ff88] text-black text-[10px] px-4 py-2 rounded-lg font-black">BAIXAR</a></div>`;
    }
  });
  if($('out').innerHTML===''){
    // fallback mostra JSON
    $('out').innerHTML=`<div class="bg-zinc-900 p-3 rounded-xl text-[10px] break-all">${JSON.stringify(data).slice(0,500)}</div>`;
  }
  $('btn').innerText='✅ 6 STEMS PRONTOS!'; $('st').innerText='Pronto! Clique em BAIXAR em cada faixa. Se der erro, recarrega e tenta de novo (servidor grátis lota as vezes)';
 }catch(e){
  console.error(e);
  alert('Erro do servidor grátis: '+e+'. Ele lota as vezes, tenta de novo em 30s');
  $('btn').innerText='TENTAR DE NOVO (GRÁTIS)';
  $('st').innerText='Erro: '+e.message+' - O servidor grátis está lotado, tenta de novo em 1 minuto';
 }
};
</script></body></html>
