<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADAT PLAYER - VU Analog</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;font-family:system-ui}
.app{width:100%;max-width:860px;background:#1a1a1d;border-radius:20px;padding:24px;border:1px solid #2a2a2e}
.time{font-family:monospace;font-size:64px;color:#ff8c1a;text-align:center;text-shadow:0 0 18px #ff8c1a}
.vus{display:flex;gap:24px;justify-content:center;margin:16px 0}
.vu{width:320px;height:200px;background:radial-gradient(#ffe0b0,#ff8c1a 200%);border-radius:160px 160px 20px 20px;position:relative;border:6px solid #111;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.vu canvas{width:100%;height:100%}
.vu b{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#ff8c1a;padding:2px 14px;border-radius:4px;font-size:14px;color:#000}
.controls{display:flex;gap:14px;justify-content:center;margin-top:14px}
button{border:0;border-radius:10px;padding:12px 24px;font-weight:800;cursor:pointer}
.rec{background:#e53935;color:white}.play{background:#333;color:white;min-width:180px}.eject{background:#e53935;color:white}
</style>
</head>
<body>
<div class="app">
<div style="color:white;font-weight:800">ADAT PLAYER • VU ANALÓGICO • DEVICE: ADAT XT</div>
<div class="time" id="time">00:00:00</div>
<div class="vus">
  <div class="vu"><canvas id="vuL"></canvas><b>L</b></div>
  <div class="vu"><canvas id="vuR"></canvas><b>R</b></div>
</div>
<div class="controls">
  <button class="rec">● REC</button>
  <button class="play" id="playBtn" onclick="toggle()">▶ PLAY / PAUSE</button>
  <button class="eject" onclick="document.getElementById('file').click()">⏏ EJECT</button>
</div>
</div>
<audio id="audio"></audio><input type="file" id="file" accept="audio/*" style="display:none">
<script>
const audio=document.getElementById('audio'), timeEl=document.getElementById('time'), fileIn=document.getElementById('file');
let actx, analyser, data, needles={L:-50,R:-50}, target={L:-50,R:-50};
function drawVU(canvas, val){
  const ctx=canvas.getContext('2d'); const w=canvas.width=canvas.clientWidth*2; const h=canvas.height=canvas.clientHeight*2;
  ctx.clearRect(0,0,w,h);
  // escala
  ctx.save(); ctx.translate(w/2,h*0.85); ctx.scale(1.2,1.2);
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  for(let dB=-20; dB<=3; dB+=1){
    let ang = (dB+20)/23 * Math.PI - Math.PI; // -20 a +3 = 0 a PI
    let r1 = dB%5==0? 90:80, r2=100;
    ctx.beginPath(); ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1); ctx.lineTo(Math.cos(ang)*r2, Math.sin(ang)*r2);
    ctx.strokeStyle = dB>0 ? '#c00' : '#000'; ctx.stroke();
  }
  ctx.restore();
  // agulha
  ctx.save(); ctx.translate(w/2,h*0.85);
  let ang = (Math.max(-20,Math.min(3,val))+20)/23 * Math.PI - Math.PI;
  ctx.rotate(ang+Math.PI/2); ctx.fillStyle='#111'; ctx.fillRect(-3,0,6,-110);
  ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function animate(){
  requestAnimationFrame(animate);
  if(analyser){ analyser.getByteFrequencyData(data);
    let l=0,r=0; for(let i=0;i<8;i++) l+=data[i]; for(let i=8;i<16;i++) r+=data[i];
    l=l/8; r=r/8;
    let dBL = (l/255)*23-20; let dBR = (r/255)*23-20;
    target.L = dBL; target.R = dBR;
  }
  // ballistics tipo VU real - lento
  needles.L += (target.L - needles.L)*0.15;
  needles.R += (target.R - needles.R)*0.15;
  drawVU(document.getElementById('vuL'), needles.L);
  drawVU(document.getElementById('vuR'), needles.R);
  if(audio.duration) timeEl.textContent=new Date(audio.currentTime*1000).toISOString().substr(14,8);
}
function ensure(){ if(!actx){ actx=new AudioContext(); analyser=actx.createAnalyser(); analyser.fftSize=32; data=new Uint8Array(analyser.frequencyBinCount); actx.createMediaElementSource(audio).connect(analyser); analyser.connect(actx.destination); } }
function toggle(){ ensure(); if(!audio.src){ fileIn.click(); return;} if(audio.paused) audio.play(); else audio.pause(); }
fileIn.onchange=e=>{ const f=e.target.files[0]; if(!f) return; audio.src=URL.createObjectURL(f); ensure(); audio.play(); }
animate();
</script>
</body>
</html>
