
<label>Pasta / Arquivo:</label>
<select id="comboHtmls"></select>

<script>
  // lista que tu já tem no repo
  const arquivos = [
    "adat1.html",
    "adat2.html", 
    "adat4.html",
    "adat5.html",
    "admin.html",
    "backlista.html"
  ];

  const combo = document.getElementById('comboHtmls');
  arquivos.forEach(arq => {
    let opt = document.createElement('option');
    opt.value = arq;
    opt.textContent = arq;
    combo.appendChild(opt);
  });

  combo.addEventListener('change', () => {
    window.location.href = combo.value; // abre o html
  });
</script>
