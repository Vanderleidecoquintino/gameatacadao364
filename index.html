function calc(){return lista.reduce((s,p)=>{let v=parseFloat(String(p.preco).replace('R$','').replace(',','.'));return isNaN(v)?s:s+v},0)}
let sv=null;function salvar(){clearTimeout(sv);sv=setTimeout(()=>{localStorage.setItem('atacadao364_v56',JSON.stringify(lista));document.getElementById('lista').innerHTML='💾 Salvo!';setTimeout(render,500)},200)}
function pagina(d){let m=Math.ceil(prods.length/pp)-1;pag+=d;if(pag<0)pag=0;if(pag>m)pag=m;render()}
function render(){let c=document.getElementById('prods');c.innerHTML='';let sl=prods.slice(pag*pp,(pag+1)*pp);sl.forEach((p,iG)=>{let i=pag*pp+iG,sel=lista.find(l=>l.nome==p.nome),cor=p.ladoIdx==1?'#00d4ff':'#ff0',d=document.createElement('div');d.className='p'+(sel?' sel':'');d.innerHTML=`<div style="font-size:22px">${p.emo}</div><div style="font-size:7px;font-weight:bold">${p.nome}</div><div style="font-size:7px;color:#0f0">${p.preco}</div><div style="font-size:5px;background:${cor};color:#000;padding:1px;border-radius:3px;font-weight:900">[${p.g}] L${p.lado} P${p.pos}/17</div><button onclick="tog(${i})">${sel?'✓':'ADD'}</button>`;c.appendChild(d)});document.getElementById('lista').innerHTML=lista.length==0?`✅ ${prods.length} prods - 17 VERT 3M + ADM + BORDA FIX + MEIO`:lista.map(l=>`${l.emo} ${l.nome} L${l.lado} P${l.pos}`).join(' | ');document.getElementById('total').innerText=`TOTAL R$ ${calc().toFixed(2)} (${lista.length}) | 17 VERT 3M ADM MEIO`;let cb=document.getElementById('combo');cb.innerHTML='';prods.forEach(p=>{let o=document.createElement('option');o.value=p.x+','+p.y;o.innerText=`${p.emo} ${p.nome} P${p.pos}/17`;cb.appendChild(o)})}

let lab=[],px=27,py=15,tx=27,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0,vel=250;

let idxR=0,wait=false,ord=[];

function rota(){lista.forEach(l=>l.visitado=false);let r=[...lista],at={x:27,y:15},o=[];while(r.length){r.sort((a,b)=>(Math.abs(at.x-a.x)+Math.abs(at.y-a.y))-(Math.abs(at.x-b.x)+Math.abs(at.y-b.y)));let pr=r.shift();o.push(pr);at=pr}ord=o;idxR=0;prox()}

function init(){lab=[];for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==18||x==0||x==COLS-1)lab[y][x]=0;else if(y==9)lab[y][x]=0;else if(x%2==1)lab[y][x]=1;else lab[y][x]=0}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}}}return[]}

function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2;camX+=(tX-camX)*0.12;camY+=(tY-camY)*0.12;let mx=Math.max(0,COLS*W-vw),my=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(mx,camX));camY=Math.max(0,Math.min(my,camY))}

+20+off, it.y*H+5)});ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(px*W+20,py*H+13,10,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();document.getElementById('pos').innerText=`X:${px} Y:${py} P${ord[idxR]?.pos||''}/17`;document.getElementById('console').innerText=ord.filter(l=>!l.visitado).length>0?`📍 ${idxR+1}/${ord.length} ${ord[idxR]?.nome} [${ord[idxR]?.g} L${ord[idxR]?.lado} P${ord[idxR]?.pos}/17] 3M Y=9 LIVRE - MEIO CORREDOR`:'🎉 Pronto 3M + DEMO!'}
function step(){if(cam.length==0){clearInterval(tm);tm=null;let al=ord[idxR];if(al&&px==al.x&&py==al.y&&!al.visitado&&!wait){wait=true;show(al)}draw();return}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25)rastro.shift();px=p.x;py=p.y;draw()}
function mv(dx,dy){if(tm){clearInterval(tm);tm=null}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25)rastro.shift();px=nx;py=ny;draw()}
function ir(x,y){if(tm){clearInterval(tm);tm=null}x=Math.max(1,Math.min(COLS-2,parseInt(x)||27));y=Math.max(1,Math.min(ROWS-2,parseInt(y)||15));if(lab[y]&&lab[y][x]==1){if(x>0&&lab[y][x-1]!=1)x--;else if(x<COLS-1&&lab[y][x+1]!=1)x++}if(x==27&&y==15)rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){if(px!=x||py!=y){px=x;py=y}let al=ord[idxR];if(al&&px==al.x&&py==al.y&&!al.visitado&&!wait){wait=true;show(al)}draw();return}tm=setInterval(step,vel);draw()}

function abrirADM(){document.getElementById('admPanel').style.display='block';renderADM()}
function fecharADM(){document.getElementById('admPanel').style.display='none';carregar()}
function filtrarADM(){filtro=filtro==0?25:filtro==25?26:0;renderADM()}
function renderADM(){let q=(document.getElementById('buscaADM').value||'').toLowerCase(),html='',fil=prods.filter(p=>{let ok=p.nome.toLowerCase().includes(q);if(filtro!=0)ok=ok&&p.lado==filtro;return ok});fil.slice(0,60).forEach(p=>{let idx=prods.indexOf(p),cor=p.ladoIdx==1?'#00d4ff':'#ff0';html+=`<div style="display:flex;justify-content:space-between;align-items:center;background:#000;padding:4px;margin:2px 0;border-radius:6px;border:1px solid #222;font-size:8px"><div style="flex:1">${p.emo} <b>${p.nome}</b><br><small style="background:${cor};color:#000;padding:1px 3px;border-radius:3px;font-weight:900">[${p.g}] L${p.lado} P${p.pos}/17 X${p.x} Y${p.y} 3M</small></div><div style="display:flex;gap:2px"><button onclick="editADM(${idx})" style="background:#0f0;color:#000;border:none;padding:3px 6px;border-radius:4px;font-weight:bold;font-size:8px">EDIT</button><button onclick="if(confirm('Apagar?')){prods.splice(${idx},1);exportar()}" style="background:#f00;color:#fff;border:none;padding:3px 5px;border-radius:4px;font-size:8px">X</button></div></div>`});document.getElementById('listaADM').innerHTML=html||'Vazio - clique 442'}
function setEL(i){curEL=i;document.getElementById('eL1').style.background=i==1?'#0f0':'#000';document.getElementById('eL2').style.background=i==2?'#ff0':'#000';document.getElementById('eL1').style.color=i==1?'#000':'#0f0';document.getElementById('eL2').style.color=i==2?'#000':'#0f0'}
function editADM(i){let p=prods[i];editIdx=i;document.getElementById('eNome').value=p.nome;document.getElementById('eEmoji').value=p.emo;document.getElementById('eG').value=p.g;document.getElementById('eX').value=p.x;document.getElementById('eY').value=p.y;document.getElementById('ePos').value=p.pos;curEL=p.ladoIdx||1;setEL(curEL);document.getElementById('formEdit').style.display='block'}
function cancelE(){document.getElementById('formEdit').style.display='none';editIdx=-1}
function saveE(){if(editIdx<0)return;let g=(document.getElementById('eG').value||'25-26').toUpperCase(),x=MAP[g]||2,y=parseInt(document.getElementById('eY').value)||10,pos=parseInt(document.getElementById('ePos').value)||10,lado=ladoNum(g,curEL);if(y==9)y=8;prods[editIdx]={nome:document.getElementById('eNome').value.toUpperCase(),emo:document.getElementById('eEmoji').value||'📦',g,lado,ladoIdx:curEL,preco:prods[editIdx].preco,x,y,pos};exportar();cancelE();renderADM();render()}
function exportar(){localStorage.setItem(KEY,JSON.stringify(prods));localStorage.setItem('atacadao364_FINAL',JSON.stringify(prods));document.getElementById('msgADM').innerText='✅ '+prods.length+' salvos | 17 VERT 3M + ADM + MEIO + BORDA FIX';carregar();renderADM()}
carregar();window.addEventListener('resize',resize);
document.getElementById('combo').addEventListener('change',()=>{let v=document.getElementById('combo').value.split(',');ir(parseInt(v[0]),parseInt(v[1]))});
</script></body></html>
