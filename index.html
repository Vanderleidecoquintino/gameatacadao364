<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:monospace;height:100dvh;overflow:hidden}
#tela1{height:100dvh;display:flex;flex-direction:column}
#t1top{background:#00ff88;color:#000;padding:10px;text-align:center;font-weight:900;font-size:12px;display:flex;justify-content:space-between}
#t1top button{height:28px;padding:0 8px;border-radius:6px;border:1px solid #000;background:#000;color:#00ff88;font-weight:bold;font-size:9px}
#t1lista{background:#0a0a0a;padding:6px;min-height:35px;max-height:60px;overflow:auto;border-bottom:2px solid #00ff88;font-size:10px;color:#00ff88}
#t1produtos{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prod{border:2px solid #222;background:#111;border-radius:10px;padding:6px;text-align:center}
.prod.sel{border-color:#00ff88;background:#002a12;box-shadow:0 0 8px #00ff88}
.prod button{width:100%;margin-top:4px;height:26px;border-radius:6px;border:1px solid #00ff88;background:#00ff88;color:#000;font-weight:bold;font-size:9px}
#t1btns{padding:6px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;background:#0a0a0a;border-top:1px solid #222}
#t1btns button{height:38px;min-width:50px;flex:1;max-width:100px;border-radius:8px;border:2px solid #00ff88;font-weight:900;font-size:9px}
#btnGo{background:#00ff88;color:#000;flex:1.5}
#totalBar{background:#001a0a;border-top:2px solid #00ff88;padding:5px;text-align:center;font-weight:900;color:#00ff88;font-size:11px}
#tela2{display:none;height:100dvh;flex-direction:column;position:relative}
#gps{background:#00ff88;color:#000;padding:4px;text-align:center;font-size:10px;font-weight:bold}
#console{background:#111;color:#00ff88;padding:3px;font-size:9px;border-bottom:1px solid #00ff88}
canvas{flex:1;width:100%;background:#000;border:2px solid #00ff88;display:block}
.btns{display:grid;grid-template-columns:32px 32px 32px 32px 1fr 52px;gap:3px;padding:3px;background:#0a0a0a}
button{height:32px;border-radius:6px;border:1.5px solid #00ff88;font-weight:bold}
.bm{background:#222;color:#00ff88}
.bway{background:#00ff88;color:#000;font-size:7px}
#combo{height:32px;border-radius:6px;border:1.5px solid #00ff88;background:#fff;color:#000;font-weight:bold;font-size:9px;width:100%}
#modalPego{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:14px;border-radius:16px;border:3px solid #00ff88;z-index:100;display:none;text-align:center;min-width:250px}
#admPanel{display:none;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#111;padding:10px;border:2px solid #ff0;border-radius:12px 12px 0 0;z-index:200;max-height:80dvh;overflow:auto}
</style>

<body>
<div id="tela1">
<div id="t1top"><span>INDEX V68 - 25-26 ESQ / 1-2 DIR</span><button onclick="abrirADM()">⚙️ ADM</button></div>
<div id="t1lista">Carregando...</div>
<div id="t1produtos"></div>

<div id="t1btns">
<button onclick="pagina(-1)" style="background:#222;color:#00ff88">◀</button>

</div>

<div id="tela2">
<div id="gps">V68 - 25-26 ESQ / ENTRADA 1-2 DIR</div>
<div id="console">Pronto</div>
<canvas id="c"></canvas>
<div id="modalPego">
<div style="font-weight:bold;color:#16a34a">📍 CHEGOU!</div>

<div id="modalNome" style="font-weight:900;font-size:13px"></div>

<button onclick="confirmarPego()" style="width:100%;height:44px;background:#00ff88;color:#000;border:2px solid #000;border-radius:10px;margin-top:8px;font-weight:900">✅ PEGUEI! →</button>
<button onclick="pularItem()" style="width:100%;height:28px;background:#fff;color:#666;border:1px solid #ccc;border-radius:6px;margin-top:4px;font-size:9px">PULAR</button>
</div>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑ SOBE</button>

</div>
</div>

<div id="admPanel">
<h4 style="color:#ff0;text-align:center">ADM V68 - X PAR FIX</h4>
<input id="buscaADM" placeholder="BUSCAR" oninput="renderADM()" style="width:100%;padding:8px;margin:4px 0;background:#000;color:#0f0;border:1px solid #0f0;border-radius:6px">
<div id="listaADM" style="max-height:200px;overflow:auto"></div>
<div style="display:flex;gap:4px;margin-top:6px">
<button onclick="exportarADM()" style="flex:1;background:#0f0;color:#000">💾 SALVAR TUDO</button>

</div>

</div>

<script>
const COLS=27,ROWS=19,W=40,H=26,KEY='ADM_V615_FIX';
// ✅ UNIFICADO CORRETO: X PAR = corredor livre
const MAP_G = {'25-26':2,'23-24':4,'21-22':6,'19-20':8,'17-18':10,'15-16':12,'13-14':14,'11-12':16,'9-10':18,'7-8':20,'5-6':22,'3-4':24,'1-2':26};
function getXByG(g){ g=(g||'').toUpperCase(); if(MAP_G[g]) return MAP_G[g]; for(let k in MAP_G){ if(g.includes(k)) return MAP_G[k]; } return 2; }
function getGByX(x){ let best='25-26',dist=99; for(let k in MAP_G){ let d=Math.abs(x-MAP_G[k]); if(d<dist){dist=d; best=k;} } return best; }
let produtos=[]; let listaT1=JSON.parse(localStorage.getItem('atacadao364_v56')||'[]');
let paginaT1=0; const porPagina=40;

async function carregarProdutos(){
  let raw=null; try{ raw=JSON.parse(localStorage.getItem('atacadao364_FINAL')||'null'); }catch(e){}
  if(!raw ||!raw.length){ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }
  if(!raw ||!raw.length){ raw=[{nome:"BALA FINI",g:"25-26",preco:"2.90",emoji:"🍬",x:2,y:16},{nome:"ARROZ 5KG",g:"25-26",preco:"26.90",emoji:"🍚",x:2,y:2}]; }
  produtos = raw.map(p=>{
      try{
        let g=(p.corredor||p.g||'25-26').toUpperCase();
        let x=parseInt(p.x); if(isNaN(x)||x%2==1) x=getXByG(g); // FIX: garante X par
        let y=parseInt(p.y); if(isNaN(y)||y<1||y>16) y=10;
        return { x:x, y:y, nome:(p.nome||'').toUpperCase().trim(), emo:p.emoji||p.emo||'📦', preco:String(p.preco||'').includes('R$')?p.preco:`R$ ${p.preco}`, g:getGByX(x) };
      }catch(e){return null}
    }).filter(Boolean);
  renderT1();
}
function provocar180Index(){
 if(!confirm('Criar 180 produtos? X:2=25-26 ESQ até X:26=1-2 DIR')) return;
 const gondolas=Object.keys(MAP_G); const xs=Object.values(MAP_G);
 let novos=[]; let c=0;
 gondolas.forEach((g,gi)=>{
  for(let y=2;y<=16;y++){ c++; if(c>180) return; novos.push({nome:`PROD ${c} ${g}`,emoji:c%3==0?'🧴':c%3==1?'🛢️':'🍬',g:g,preco:(Math.random()*20+2).toFixed(2),x:xs[gi],y:y}); }
 });
 let atual=JSON.parse(localStorage.getItem(KEY)||'[]'); atual=atual.concat(novos);
 localStorage.setItem(KEY,JSON.stringify(atual)); localStorage.setItem('atacadao364_FINAL',JSON.stringify(atual));
 carregarProdutos(); alert('180 CRIADOS! 25-26 ESQ X:2 até 1-2 DIR X:26');
}
function falar(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}}
function falarLista(){if(!listaT1.length){falar('Lista vazia');return;}falar(`Rota de ${listaT1.length} itens`);}
function calcTotal(){return listaT1.reduce((s,p)=>{let v=parseFloat(String(p.preco||'').replace('R$','').replace(',','.').trim());return isNaN(v)?s:s+v;},0);}
let saveT=null; function salvarLista(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('atacadao364_v56',JSON.stringify(listaT1));document.getElementById('t1lista').innerHTML='💾 Salvo!';setTimeout(()=>renderT1(),600);}catch(e){}},300);}
function pagina(d){let max=Math.ceil(produtos.length/porPagina)-1; paginaT1+=d; if(paginaT1<0) paginaT1=0; if(paginaT1>max) paginaT1=max; renderT1();}
function renderT1(){
 let cont=document.getElementById('t1produtos'); cont.innerHTML='';
 let slice=produtos.slice(paginaT1*porPagina,(paginaT1+1)*porPagina);
 let frag=document.createDocumentFragment();
 slice.forEach((p,iG)=>{
   let i=paginaT1*porPagina+iG;
   let sel=listaT1.find(l=>l.nome==p.nome);
   let div=document.createElement('div'); div.className='prod'+(sel?' sel':'');
   div.innerHTML=`<div style="font-size:28px">${p.emo}</div><div style="font-size:9px;font-weight:bold">${p.nome}</div><div style="font-size:9px;color:#00ff88">${p.preco}</div><div style="font-size:7px;background:#00ff88;color:#000;padding:2px;border-radius:4px">[${p.g}] X:${p.x} Y:${p.y} POS:${17-p.y}</div><button onclick="toggleProd(${i})">${sel?'✓':' + ADD'}</button>`;
   frag.appendChild(div);
 });
 cont.appendChild(frag);
 let total=calcTotal();
 document.getElementById('t1lista').innerHTML=listaT1.length==0?`✅ ${produtos.length} produtos - X:2=25-26 ESQ / X:26=1-2 DIR` :listaT1.map(l=>`${l.emo} ${l.nome} [${l.g}]`).join(' | ');
 document.getElementById('totalBar').innerText=`TOTAL: R$ ${total.toFixed(2).replace('.',',')} (${listaT1.length}) | PÁG ${paginaT1+1}/${Math.ceil(produtos.length/porPagina)}`;
 document.getElementById('btnGo').innerText=`🗺️ IR (${listaT1.length})`;
 let combo=document.getElementById('combo'); combo.innerHTML=''; produtos.forEach(p=>{let o=document.createElement('option');o.value=p.x+','+p.y;o.innerText=`${p.emo} ${p.nome} [${p.g}] X:${p.x} Y:${p.y}`;combo.appendChild(o);});
}
function toggleProd(i){let p=produtos[i];let idx=listaT1.findIndex(l=>l.nome==p.nome);if(idx>=0) listaT1.splice(idx,1);else listaT1.push({...p}); salvarLista(); renderT1(); if(navigator.vibrate) navigator.vibrate(50);}
function limparT1(){if(!confirm('Limpar?')) return; listaT1=[]; localStorage.removeItem('atacadao364_v56'); renderT1();}
function irParaMercado(){if(!listaT1.length){alert('Adicione 1 produto!');return;}document.getElementById('tela1').style.display='none';document.getElementById('tela2').style.display='flex';init();resize();draw();loop();setTimeout(()=>{gerarRotaDaLista();},400);}
function voltarLista(){document.getElementById('tela2').style.display='none';document.getElementById('tela1').style.display='flex';if(tm){clearInterval(tm);tm=null;}document.getElementById('modalPego').style.display='none';}
let lab=[],px=26,py=15,tx=26,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0,vel=250;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let idxRota=0,esperando=false,listaOrdenada=[];
function mudaVel(d){vel+=d;if(vel<30) vel=30;if(vel>5000) vel=5000;document.getElementById('gps').innerText='VEL '+vel+'ms';if(tm){ clearInterval(tm); tm=setInterval(step,vel); }}
function gerarRotaDaLista(){ listaT1.forEach(l=>l.visitado=false); let resto=[...listaT1]; let atual={x:26,y:15}; let ordem=[]; while(resto.length){ resto.sort((a,b)=>(Math.abs(atual.x-a.x)+Math.abs(atual.y-a.y))-(Math.abs(atual.x-b.x)+Math.abs(atual.y-b.y))); let prox=resto.shift(); ordem.push(prox); atual=prox; } listaOrdenada=ordem; idxRota=0; irParaProximoDaLista(); }
function irParaProximoDaLista(){if(idxRota>=listaOrdenada.length){let total=calcTotal();document.getElementById('console').innerText='🎉 COMPLETA!';alert(`🎉 FINALIZADO! ${listaOrdenada.length} itens - R$ ${total.toFixed(2).replace('.',',')}`);return;}ir(listaOrdenada[idxRota].x,listaOrdenada[idxRota].y);}
function mostrarModalPego(item){document.getElementById('modalProd').innerText=item.emo;document.getElementById('modalNome').innerText=item.nome;document.getElementById('modalGond').innerText='GÔNDOLA ['+item.g+'] X:'+item.x+' Y:'+item.y+' POS:'+(17-item.y);document.getElementById('modalPreco').innerText=item.preco;document.getElementById('modalProgress').innerText='Item '+(idxRota+1)+'/'+listaOrdenada.length;document.getElementById('modalPego').style.display='block';falar(`Chegou na gôndola ${item.g}, ${item.nome}`);if(navigator.vibrate) navigator.vibrate([200,100,200]);}
function confirmarPego(){listaOrdenada[idxRota].visitado=true;document.getElementById('modalPego').style.display='none';idxRota++;esperando=false;setTimeout(()=>{irParaProximoDaLista();},500);}
function pularItem(){document.getElementById('modalPego').style.display='none';idxRota++;irParaProximoDaLista();}
function init(){lab=[];for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==8||y==17||x==0||x==COLS-1) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0;}} }
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}}}return []}
function resize(){let r=cv.getBoundingClientRect();vw=r.width;vh=r.height||400;cv.width=vw;cv.height=vh;draw();}
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.12; camY+=(tY-camY)*0.12;let maxX=Math.max(0,COLS*W-vw),maxY=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(maxX,camX));camY=Math.max(0,Math.min(maxY,camY));}
function draw(){
  updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ if(lab[y][x]==1){ ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H); ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2); ctx.fillStyle='#00ff88';ctx.font='bold 8px monospace';ctx.textAlign='center'; let n=''; if(x==1)n='25-26'; else if(x==3)n='23-24'; else if(x==5)n='21-22'; else if(x==7)n='19-20'; else if(x==9)n='17-18'; else if(x==11)n='15-16'; else if(x==13)n='13-14'; else if(x==15)n='11-12'; else if(x==17)n='9-10'; else if(x==19)n='7-8'; else if(x==21)n='5-6'; else if(x==23)n='3-4'; else if(x==25)n='1-2'; if(n) ctx.fillText(n,x*W+20,y*H+14); } }
  ctx.fillStyle='#00ff88';ctx.fillRect(26*W,15*H,W,H);ctx.fillStyle='#000';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('ENTRADA 1-2',26*W+20,15*H+15);
  ctx.fillStyle='#ff0';ctx.fillRect(2*W,15*H,W,H);ctx.fillStyle='#000';ctx.fillText('25-26 ESQ',2*W+20,15*H+15);
  for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle='rgba(0,255,136,'+(0.4+a*0.6)+')';ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}
  if(!(tx==26&&ty==15)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}
  listaOrdenada.forEach((it,i)=>{if(it.visitado||i<idxRota) return;ctx.fillStyle=i==idxRota?'#00ff88':'#ef4444';ctx.beginPath();ctx.arc(it.x*W+20,it.y*H+13,i==idxRota?11:8,0,6.28);ctx.fill();ctx.fillStyle=i==idxRota?'#000':'#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(i+1,it.x*W+20,it.y*H+16);});
  ctx.fillStyle='#00ff88';ctx.beginPath();ctx.arc(px*W+20,py*H+13,10,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  let pend=listaOrdenada.filter(l=>!l.visitado).length;
  document.getElementById('console').innerText=pend>0?`📍 ${idxRota+1}/${listaOrdenada.length} - ${listaOrdenada[idxRota]?.nome} [${listaOrdenada[idxRota]?.g}] X:${listaOrdenada[idxRota]?.x} Y:${listaOrdenada[idxRota]?.y} POS:${17-listaOrdenada[idxRota]?.y}`:'🎉 Pronto!';
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;let alvo=listaOrdenada[idxRota];if(alvo&&px==alvo.x&&py==alvo.y&&!alvo.visitado&&!esperando){esperando=true;mostrarModalPego(alvo);}draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;draw();}
function ir(x,y){
  if(tm){clearInterval(tm);tm=null;}
  x=Math.max(1,Math.min(COLS-2,parseInt(x)||26));
  y=Math.max(1,Math.min(ROWS-2,parseInt(y)||15));
  if(lab[y] && lab[y][x]==1){ if(x>0 && lab[y][x-1]!=1) x--; else if(x<COLS-1 && lab[y][x+1]!=1) x++; }
  if(x==26&&y==15) rastro=[];
  tx=x;ty=y;cam=achar(px,py,x,y);
  if(cam.length==0){ if(px!=x || py!=y){ px=x; py=y; } let alvo=listaOrdenada[idxRota]; if(alvo&&px==alvo.x&&py==alvo.y&&!alvo.visitado&&!esperando){esperando=true;mostrarModalPego(alvo);} draw(); return; }
  tm=setInterval(step,vel);draw();
}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
function abrirADM(){document.getElementById('admPanel').style.display='block';renderADM();}
function fecharADM(){document.getElementById('admPanel').style.display='none';carregarProdutos();}
function renderADM(){ let q=(document.getElementById('buscaADM').value||'').toLowerCase(); let html=''; let filtro=produtos.filter(p=>p.nome.toLowerCase().includes(q)); filtro.slice(0,50).forEach(p=>{ let idx=produtos.indexOf(p); html+=`<div style="display:flex;justify-content:space-between;background:#000;padding:4px;margin:2px 0;border-radius:6px;border:1px solid #222;font-size:9px"><div>${p.emo} ${p.nome} [${p.g}] X:${p.x} Y:${p.y}</div><div><button onclick="produtos.splice(${idx},1);localStorage.setItem(KEY,JSON.stringify(produtos));localStorage.setItem('atacadao364_FINAL',JSON.stringify(produtos));renderADM();carregarProdutos();" style="background:#f00;color:#fff;border:none;padding:2px 6px;border-radius:4px">X</button></div></div>`; }); document.getElementById('listaADM').innerHTML=html||'Vazio'; }
function exportarADM(){ localStorage.setItem(KEY,JSON.stringify(produtos)); localStorage.setItem('atacadao364_FINAL',JSON.stringify(produtos)); document.getElementById('msgADM').innerText='✅ '+produtos.length+' salvos'; carregarProdutos(); }
