<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ATACADÃO 364 - V60 AVIÃO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0a0a0a;color:#fff}
header{position:sticky;top:0;z-index:99;background:#111;padding:12px;display:flex;gap:8px;align-items:center;border-bottom:2px solid #00ff88}
#lista{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#1a1a1a;border-radius:12px;padding:10px;border:1px solid #333}
.card b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:#00ff88;font-weight:800}
.btn-add{width:100%;margin-top:6px;background:#00ff88;border:0;border-radius:8px;padding:8px;font-weight:900;color:#000}
#go{position:fixed;bottom:12px;left:12px;right:12px;background:#00ff88;color:#000;border:0;border-radius:16px;padding:18px;font-size:20px;font-weight:900;z-index:100;box-shadow:0 8px 30px #00ff8855}
#mapaView{display:none;position:fixed;inset:0;background:#000;z-index:200;padding:12px}
</style>
</head>
<body>

<header>
<span>🛒</span><b id="total">ATACADÃO 364 V60</b>
<button onclick="limparTudo()" style="margin-left:auto;background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px">Limpar</button>
</header>

<div id="lista"></div>

<button id="go" onclick="irAoMercado()">🗺️ IR AO MERCADO (<span id="qtd">0</span>)</button>

<div id="mapaView">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 id="passo">VÁ PARA GÔNDOLA 23-24</h2>
    <button onclick="this.parentElement.parentElement.style.display='none'" style="background:#222;color:#fff;border:0;border-radius:8px;padding:8px 12px">✕</button>
  </div>
  <div id="rota" style="font-size:18px;line-height:1.6"></div>
  <button onclick="proximoItem()" style="width:100%;margin-top:20px;background:#00ff88;border:0;border-radius:16px;padding:18px;font-weight:900;font-size:18px;color:#000">✅ PEGUEI, PRÓXIMO</button>
</div>

<script>
// ============ MATRIX - AJUSTE FÁCIL AQUI ============
const MATRIX_GONDOLAS=[
  {g:'25-26',x:1},{g:'23-24',x:3},{g:'21-22',x:5},{g:'19-20',x:7},{g:'17-18',x:9},{g:'15-16',x:11},{g:'13-14',x:13},{g:'11-12',x:15},{g:'9-10',x:17},{g:'7-8',x:19},{g:'5-6',x:21},{g:'3-4',x:23},{g:'1-2',x:25}
];
const KEY='atacadao364_FINAL'; // CHAVE ÚNICA - NÃO MUDA
function gParaX(g){return (MATRIX_GONDOLAS.find(m=>m.g==g)||{x:3}).x;}
function normaliza(arr){return arr.map(p=>({...p, x:gParaX(p.g||p.corredor), y:2, g:(p.g||p.corredor||'23-24'), nome:(p.nome||'').toUpperCase()}));}
// ====================================================

let produtos=[], carrinho=[], idxRota=0;

async function init(){
  let salvo=localStorage.getItem(KEY);
  if(salvo && JSON.parse(salvo).length>0){
    produtos=normaliza(JSON.parse(salvo));
  }else{
    let r=await fetch('./produtos.json').then(x=>x.json()).catch(()=>[]);
    produtos=normaliza(r.length?r:mock());
    localStorage.setItem(KEY, JSON.stringify(produtos));
  }
  renderRapido();
}
function mock(){return [{nome:'ARROZ 5KG',g:'23-24',preco:'22,90',emoji:'🍚'},{nome:'FEIJÃO 1KG',g:'23-24',preco:'7,49',emoji:'🫘'},{nome:'ÓLEO 900ML',g:'21-22',preco:'6,99',emoji:'🫒'}];}

function renderRapido(){
  const frag=document.createDocumentFragment();
  produtos.forEach((p,i)=>{
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div style="font-size:28px">${p.emoji||'📦'}</div><b>${p.nome}</b><span>R$ ${p.preco}</span><button class="btn-add" onclick="add(${i})">+ ADD</button>`;
    frag.appendChild(d);
  });
  document.getElementById('lista').innerHTML=''; document.getElementById('lista').appendChild(frag);
}

function add(i){ carrinho.push(produtos[i]); document.getElementById('qtd').textContent=carrinho.length; if(navigator.vibrate) navigator.vibrate(30); }
function limparTudo(){ if(confirm('Limpar lista?')){ localStorage.removeItem(KEY); location.reload(); } }

function irAoMercado(){
  if(!carrinho.length) return alert('Adicione produtos!');
  carrinho.sort((a,b)=>gParaX(a.g)-gParaX(b.g));
  idxRota=0;
  document.getElementById('mapaView').style.display='block';
  mostrarPasso();
}
function mostrarPasso(){
  let p=carrinho[idxRota];
  document.getElementById('passo').textContent=`GÔNDOLA ${p.g}`;
  document.getElementById('rota').innerHTML=`<div style="font-size:60px">${p.emoji}</div><div style="font-size:28px;font-weight:900">${p.nome}</div><div style="color:#00ff88;font-size:22px;margin-top:8px">R$ ${p.preco}</div><div style="margin-top:20px;background:#111;padding:12px;border-radius:12px">📍 Corredor ${p.g}<br>➡️ Siga reto até o final<br>👀 Olhe na altura dos olhos</div>`;
  let msg=new SpeechSynthesisUtterance(`Vá para gôndola ${p.g}, pegue ${p.nome}`); msg.lang='pt-BR'; speechSynthesis.speak(msg);
}
function proximoItem(){
  idxRota++;
  if(idxRota>=carrinho.length){ alert('✅ COMPRA FINALIZADA!'); document.getElementById('mapaView').style.display='none'; carrinho=[]; document.getElementById('qtd').textContent=0; }
  else mostrarPasso();
}

init();
</script>
</body>
</html>
