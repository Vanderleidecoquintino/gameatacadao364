<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAT MESA SHOW - FULL PLAYLIST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#000;color:#fff;padding:10px;display:flex;justify-content:center}
.app{width:100%;max-width:1050px;background:#1a1a1d;border-radius:20px;padding:14px;border:1px solid #2a2a2e}
.top{display:flex;justify-content:space-between;font-weight:900;color:#ff8c1a;font-size:13px}
.time{font-family:monospace;font-size:42px;color:#ff8c1a;text-align:center;text-shadow:0 0 18px #ff8c1a;margin:6px 0}
.vus{display:flex;gap:12px;justify-content:center}
.vu{width:360px;height:170px;background:radial-gradient(circle at 50% 80%, #ffe2b8 0%, #ffb56a 55%, #ff8c1a 120%);border-radius:180px 180px 20px 20px;border:7px solid #0e0e0f;position:relative}
.vu canvas{width:100%;height:100%}
.vu b{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:#111;color:#ffb56a;padding:2px 10px;border-radius:6px;font-size:10px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0}
.tab{padding:9px 16px;border-radius:20px;background:#222;color:#888;border:1px solid #333;cursor:pointer;font-weight:800;font-size:12px}
.tab.active{background:#ff8c1a;color:#000}
.panel{display:none} .panel.active{display:block}
.mesa{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#111;border-radius:12px;min-height:110px}
.canal{min-width:95px;background:#1a1a1a;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;border-top:3px solid #ff8c1a}
.fader{width:100%;accent-color:#ff8c1a}
button{padding:10px 14px;border:0;border-radius:8px;font-weight:800;cursor:pointer;font-size:12px}
.play{background:#ff8c1a;color:#000} .stop{background:#333;color:#fff}
#queue{background:#ff8c1a15;border:1px solid #ff8c1a55;border-radius:12px;padding:10px}
#showList{max-height:45vh;overflow-y:auto;background:#151515;border-radius:12px;padding:6px;margin-top:8px}
.song{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.status{font-size:11px;color:#ff8c1a;text-align:center;margin:4px}
input[type=file]{width:100%;background:#222;padding:10px;border-radius:8px;margin:6px 0;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>ADAT PLAYER • MESA + SHOW FULL</span><span id="status">STOPPED</span></div>
<div class="time" id="time">00:00 / 00:00</div>
<div class="vus"><div class="vu"><canvas id="vuL"></canvas><b>L</b></div><div class="vu"><canvas id="vuR"></canvas><b>R</b></div></div>
<div class="status" id="saveStatus">💾 Escolhe vários arquivos - agora é playlist de verdade!</div>

<div class="tabs">
<div class="tab active" id="tabMesa" onclick="switchTab('mesa')">MODO MESA</div>
<div class="tab" id="tabShow" onclick="switchTab('show')">MODO SHOW (100)</div>
</div>

<div id="panel-mesa" class="panel active">
<div style="text-align:center;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
<button class="play" id="playMesa">▶ PLAY MESA</button><button class="stop" id="stopMesa">⏹ STOP</button><button class="stop" onclick="clearMesa()">LIMPAR</button>
</div>
<input type="file" id="fileMesa" multiple accept="audio/*">
<div id="mesa" class="mesa"><span style="color:#555;font-size:11px;padding:20px">Carrega os stems - pode escolher vários de uma vez</span></div>
</div>

<div id="panel-show" class="panel">
<div id="queue"><b style="color:#ff8c1a">FILA: <span id="queueCount">0</span> músicas</b><div id="queueList" style="font-size:11px;color:#aaa;margin-top:4px">Vazia - carrega várias músicas que já entra na fila</div><div style="display:flex;gap:6px;margin-top:8px"><button class="play" id="playShow">▶ TOCAR FILA</button><button class="stop" id="nextShow">⏭ NEXT</button></div></div>
<input id="search" placeholder="🔍 Buscar na playlist..." style="width:100%;padding:10px;background:#222;border:1px solid #333;color:#fff;border-radius:10px;margin:8px 0">
<input type="file" id="fileShow" multiple accept="audio/*">
<div id="showList"></div>
<button class="stop" onclick="clearShow()" style="width:100%;margin-top:8px;font-size:11px">🗑️ LIMPAR BANCO SHOW</button>
</div>
</div>
